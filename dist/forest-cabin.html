class TextureBaker {
  constructor(renderer) {
    this.renderer = renderer;
    this.scene = new THREE.Scene();
    this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.mesh = new THREE.Mesh(fullscreenTriangle(), null);
    this.mesh.frustumCulled = false;
    this.scene.add(this.mesh);
    this.aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    this.targets = [];
  }
  bake(name, { size = 512, srgb = false, normal = false, strength = 4, wrap = THREE.RepeatWrapping, mipmaps = true } = {}) {
    const rt = new THREE.WebGLRenderTarget(size, size, {
      type: THREE.UnsignedByteType,
      format: THREE.RGBAFormat,
      colorSpace: srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace,
      wrapS: wrap, wrapT: wrap,
      minFilter: mipmaps ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      generateMipmaps: mipmaps,
      depthBuffer: false,
      anisotropy: this.aniso,
    });
    const mat = new THREE.ShaderMaterial({
      vertexShader: FULLSCREEN_VS,
      fragmentShader: (normal ? '#define BAKE_NORMAL\n' : '') + BAKE_PRELUDE + BAKES[name] + BAKE_MAIN,
      uniforms: { uSize: { value: size }, uStrength: { value: strength } },
      depthTest: false, depthWrite: false,
    });
    this.mesh.material = mat;
    const prev = this.renderer.getRenderTarget();
    this.renderer.setRenderTarget(rt);
    this.renderer.render(this.scene, this.camera);
    this.renderer.setRenderTarget(prev);
    mat.dispose();
    this.targets.push(rt);
    return rt.texture;
  }
}

// Render-target textures cannot be cloned (a clone has no GPU image), so the repeat is set in place.
function withRepeat(tex, size) {
  tex.repeat.set(1 / size[0], 1 / size[1]);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

/* ── Canvas plant atlas ────────────────────────────────────────────────────── */

const ATLAS_SIZE = 2048;
const ATLAS_CELLS = (() => {
  const cells = {
    fir: [[0, 0, 1024, 256], [0, 256, 1024, 256], [0, 512, 1024, 256], [0, 768, 1024, 256]],
    pine: [[1024, 0, 512, 512], [1536, 0, 512, 512]],
    birch: [[1024, 512, 512, 512], [1536, 512, 512, 512]],
    maple: [[1024, 1024, 512, 512], [1536, 1024, 512, 512]],
    fern: [[0, 1024, 1024, 256]],
    flower: [[0, 1280, 256, 256], [256, 1280, 256, 256], [512, 1280, 256, 256], [768, 1280, 256, 256]],
    leaf: [],
    shrub: [[1024, 1536, 512, 512]],
    tuft: [[1536, 1536, 512, 512]],
  };
  for (let i = 0; i < 8; i++) cells.leaf.push([(i % 4) * 256, 1536 + Math.floor(i / 4) * 256, 256, 256]);
  return cells;
})();

// UV rectangle [u0, v0, u1, v1] for an atlas cell (texture uploaded without flipY: v grows downward).
function atlasUV(kind, i = 0) {
  const [x, y, w, h] = ATLAS_CELLS[kind][i];
  return [x / ATLAS_SIZE, y / ATLAS_SIZE, (x + w) / ATLAS_SIZE, (y + h) / ATLAS_SIZE];
}

function polyAlong(pts) {
  const segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    segs.push(l);
    total += l;
  }
  return {
    total,
    at(d) {
      let i = 0;
      while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
      const t = segs[i] > 0 ? clamp(d / segs[i], 0, 1) : 0;
      const a = pts[i], b = pts[i + 1];
      return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), Math.atan2(b[1] - a[1], b[0] - a[0])];
    },
  };
}

function strokeLine(ctx, x0, y0, x1, y1, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
}

function strokePoly(ctx, pts, color, w0, w1) {
  for (let i = 1; i < pts.length; i++) {
    const t = i / (pts.length - 1);
    strokeLine(ctx, pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1], color, lerp(w0, w1, t));
  }
}

function drawFirSpray(ctx, [x0, y0, w, h], rng) {
  ctx.save();
  ctx.translate(x0, y0);
  const cy = h * 0.5;
  const len = w - 60;
  const droop = rng.range(-0.05, 0.05) * h;
  const twigPt = (t) => [28 + t * len, cy + droop * Math.sin(t * Math.PI) - t * h * 0.02];
  const dark = ['#152618', '#19291b', '#1c2f1d'];
  const mid = ['#22392a', '#264029', '#2b442b', '#253d27'];
  const light = ['#3b5a31', '#456331', '#4f6c37', '#58733a'];
  const twigs = [];
  const main = [];
  for (let i = 0; i <= 24; i++) main.push(twigPt(i / 24));
  twigs.push({ pts: main, depth: 0 });
  for (let t = 0.04; t < 0.95; t += rng.range(0.026, 0.04)) {
    const [px, py] = twigPt(t);
    for (const s of [-1, 1]) {
      if (rng() < 0.06) continue;
      const L = h * 0.47 * (1 - t * 0.5) * rng.range(0.78, 1.06);
      const a0 = s * rng.range(0.55, 0.92);
      const pts = [];
      for (let k = 0; k <= 6; k++) {
        const q = k / 6;
        const a = a0 * (1 - q * 0.22);
        pts.push([px + Math.cos(a) * L * q, py + Math.sin(a) * L * q]);
      }
      twigs.push({ pts, depth: 1 });
    }
  }
  for (const tw of twigs) strokePoly(ctx, tw.pts, '#4a3a28', tw.depth ? 2.6 : 5.5, tw.depth ? 1.0 : 2.0);
  for (const layer of [0, 1, 2]) {
    for (const tw of twigs) {
      const path = polyAlong(tw.pts);
      const step = layer === 0 ? 4.4 : 3.7;
      for (let d = 3; d < path.total; d += step * rng.range(0.8, 1.2)) {
        const q = d / path.total;
        if (layer === 2 && q < 0.62) continue;
        const [x, y, ang] = path.at(d);
        for (const s of [-1, 1]) {
          const a = ang + s * rng.range(0.85, 1.25);
          const nl = (layer === 0 ? 1.18 : 1.0) * rng.range(10, 17) * (tw.depth ? 0.92 : 1.12) * (1 - q * 0.22);
          const col = layer === 0 ? rng.pick(dark) : layer === 1 ? rng.pick(mid) : rng.pick(light);
          strokeLine(ctx, x, y, x + Math.cos(a) * nl, y + Math.sin(a) * nl, col, layer === 0 ? 3.0 : 2.2);
        }
      }
    }
  }
  ctx.restore();
}

function drawPineTuft(ctx, [x0, y0, w, h], rng) {
  const cx = x0 + w / 2, cy = y0 + h / 2, R = w * 0.46;
  const cols = ['#24391f', '#2c4424', '#33492a', '#3c5530', '#456034', '#2a3f22'];
  strokeLine(ctx, cx - R * 0.05, cy + R * 0.05, cx + R * 0.25, cy + R * 0.3, '#4b3a28', 6);
  for (let i = 0; i < 560; i++) {
    const a = rng() * TAU;
    const len = R * rng.range(0.38, 1.0);
    const st = rng.range(0, 0.16) * R;
    const sx = cx + Math.cos(a) * st, sy = cy + Math.sin(a) * st;
    const ex = cx + Math.cos(a) * (st + len), ey = cy + Math.sin(a) * (st + len);
    const bend = rng.range(-0.12, 0.12) * len;
    const mx = (sx + ex) / 2 - Math.sin(a) * bend, my = (sy + ey) / 2 + Math.cos(a) * bend;
    ctx.strokeStyle = cols[Math.min(cols.length - 1, Math.floor(rng() * cols.length * (0.6 + 0.4 * (len / R))))];
    ctx.lineWidth = rng.range(1.8, 2.8);
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(mx, my, ex, ey);
    ctx.stroke();
  }
}

function leafOutline(ctx, kind, L, W, rng) {
  ctx.beginPath();
  if (kind === 'maple') {
    const cx = L * 0.45;
    const lobes = [[0, 0.62], [0.95, 0.52], [-0.95, 0.52], [1.85, 0.34], [-1.85, 0.34]];
    const n = 140;
    for (let i = 0; i <= n; i++) {
      const phi = -Math.PI + (i / n) * TAU;
      let r = 0.34;
      for (const [pa, amp] of lobes) r = Math.max(r, 0.34 + amp * Math.pow(Math.max(0, Math.cos(phi - pa)), 10));
      r += 0.035 * Math.max(0, Math.sin(phi * 21));
      if (Math.abs(Math.abs(phi) - Math.PI) < 0.35) r *= 0.75;
      const x = cx + Math.cos(phi) * r * L * 0.62, y = Math.sin(phi) * r * L * 0.62;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  } else {
    const n = 36;
    const serr = kind === 'birch' ? 0.07 : kind === 'aspen' ? 0.02 : 0.04;
    const widest = kind === 'birch' ? 0.32 : kind === 'aspen' ? 0.45 : kind === 'willow' ? 0.4 : 0.4;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      let hw = t < widest ? Math.sin((t / widest) * Math.PI * 0.5) : Math.pow(Math.cos(((t - widest) / (1 - widest)) * Math.PI * 0.5), 0.85);
      if (kind === 'oak') hw *= 0.75 + 0.25 * Math.abs(Math.sin(t * Math.PI * 4.5));
      hw *= W * (1 + (i % 2 ? serr : -serr) * (t > 0.1 && t < 0.95 ? 1 : 0));
      pts.push([t * L, hw]);
    }
    ctx.moveTo(0, 0);
    for (const [x, y] of pts) ctx.lineTo(x, -y);
    for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.closePath();
}

function drawLeaf(ctx, x, y, ang, len, kind, color, rng, { vein = true, curl = 1 } = {}) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  strokeLine(ctx, 0, 0, len * 0.16, 0, '#4b3a26', Math.max(1, len * 0.03));
  ctx.translate(len * 0.14, 0);
  const L = len * 0.86;
  const W = (kind === 'willow' ? 0.16 : kind === 'aspen' ? 0.42 : kind === 'oak' ? 0.34 : 0.33) * L * curl;
  leafOutline(ctx, kind, L, W, rng);
  const c = new THREE.Color(color);
  const g = ctx.createLinearGradient(0, 0, L, 0);
  g.addColorStop(0, '#' + c.clone().multiplyScalar(0.78).getHexString());
  g.addColorStop(0.55, color);
  g.addColorStop(1, '#' + c.clone().lerp(new THREE.Color('#ffffff'), 0.08).getHexString());
  ctx.fillStyle = g;
  ctx.fill();
  if (vein) {
    const vc = '#' + c.clone().multiplyScalar(0.72).getHexString();
    strokeLine(ctx, 0, 0, L * (kind === 'maple' ? 0.75 : 0.92), 0, vc, Math.max(0.8, len * 0.018));
    if (kind === 'maple') {
      for (const a of [0.95, -0.95, 1.85, -1.85]) strokeLine(ctx, L * 0.45, 0, L * 0.45 + Math.cos(a) * L * 0.3, Math.sin(a) * L * 0.3, vc, Math.max(0.6, len * 0.012));
    } else {
      for (let k = 1; k < 6; k++) {
        const t = k / 6.5;
        for (const s of [-1, 1]) strokeLine(ctx, t * L, 0, t * L + L * 0.1, s * W * 0.55 * (1 - t * 0.5), vc, 0.6);
      }
    }
  }
  if (rng.chance(0.18)) {
    ctx.fillStyle = 'rgba(92, 55, 25, 0.55)';
    ctx.beginPath();
    ctx.arc(L * rng.range(0.3, 0.8), rng.range(-0.3, 0.3) * W, rng.range(1.5, 3.5), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawLeafCluster(ctx, [x0, y0, w, h], rng, kind) {
  ctx.save();
  ctx.translate(x0, y0);
  const palette = kind === 'maple'
    ? ['#d2582a', '#c2402a', '#e0812e', '#b8322c', '#d96d2b', '#e39a35', '#c9502c']
    : kind === 'shrub'
      ? ['#8f2b26', '#a3392c', '#7a2433', '#b04a2e', '#6f2a2a', '#9a3a2a']
      : ['#d8b13c', '#c99a2a', '#e2c255', '#b8a032', '#cfa634', '#a9a43a', '#dcb846'];
  const leafLen = kind === 'maple' ? [62, 86] : kind === 'shrub' ? [26, 36] : [34, 46];
  const base = [w * 0.5, h * 0.94];
  const nTw = kind === 'shrub' ? 7 : kind === 'maple' ? 4 : 5;
  const twigs = [];
  for (let i = 0; i < nTw; i++) {
    const spread = kind === 'shrub' ? 0.32 : 0.42;
    const ang = -Math.PI / 2 + (i - (nTw - 1) / 2) * spread + rng.range(-0.12, 0.12);
    const L = h * rng.range(0.55, 0.8);
    const sag = kind === 'birch' ? Math.sign(ang + Math.PI / 2) * 0.55 : 0.2 * Math.sign(ang + Math.PI / 2);
    const pts = [];
    for (let k = 0; k <= 8; k++) {
      const q = k / 8;
      const a = ang + q * q * sag;
      const prev = pts.length ? pts[pts.length - 1] : base;
      pts.push(k === 0 ? [...base] : [prev[0] + Math.cos(a) * L / 8, prev[1] + Math.sin(a) * L / 8]);
    }
    twigs.push(pts);
  }
  ctx.lineCap = 'round';
  for (const tw of twigs) strokePoly(ctx, tw, '#3d2e22', 3.2, 1.0);
  const leaves = [];
  for (const tw of twigs) {
    const path = polyAlong(tw);
    for (let d = path.total * 0.22; d < path.total; d += leafLen[0] * rng.range(0.38, 0.55)) {
      const [x, y, ang] = path.at(d);
      const s = leaves.length % 2 ? 1 : -1;
      leaves.push([x, y, ang + s * rng.range(0.45, 1.05), rng.range(leafLen[0], leafLen[1])]);
    }
    const [x, y, ang] = path.at(path.total);
    leaves.push([x, y, ang + rng.range(-0.2, 0.2), rng.range(leafLen[0], leafLen[1])]);
  }
  for (let i = leaves.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [leaves[i], leaves[j]] = [leaves[j], leaves[i]]; }
  const lk = kind === 'maple' ? 'maple' : kind === 'shrub' ? 'aspen' : 'birch';
  for (const [x, y, a, l] of leaves) drawLeaf(ctx, x, y, a, l, lk, rng.pick(palette), rng, { vein: kind !== 'shrub' });
  if (kind === 'shrub') {
    for (let i = 0; i < 14; i++) {
      const tw = rng.pick(twigs);
      const p = polyAlong(tw).at(polyAlong(tw).total * rng.range(0.3, 1));
      ctx.fillStyle = rng.pick(['#2b2f55', '#33345e', '#262645']);
      ctx.beginPath();
      ctx.arc(p[0] + rng.range(-8, 8), p[1] + rng.range(-8, 8), rng.range(3.5, 5), 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawFern(ctx, [x0, y0, w, h], rng) {
  ctx.save();
  ctx.translate(x0, y0);
  const cy = h * 0.5;
  const L = w - 30;
  const rach = (t) => [12 + t * L, cy + Math.sin(t * Math.PI * 0.8) * h * 0.06];
  const col = ['#a39f68', '#98955f', '#aaa66e', '#8f8c58'];
  const pts = [];
  for (let i = 0; i <= 30; i++) pts.push(rach(i / 30));
  strokePoly(ctx, pts, '#6e6440', 4, 1.2);
  let side = 1;
  for (let t = 0.04; t < 0.97; t += 0.036) {
    const [px, py] = rach(t);
    const pl = h * 0.47 * Math.sin(Math.PI * Math.min(1, (t + 0.12) / 1.12)) * (1 - Math.pow(t, 4) * 0.6);
    for (const s of [-1, 1]) {
      const a = s * (1.0 + rng.range(-0.08, 0.08)) - (s === side ? 0 : 0.04);
      const ex = px + Math.cos(a) * pl * 0.55, ey = py + Math.sin(a) * pl;
      strokeLine(ctx, px, py, ex, ey, '#7a7248', 1.4);
      const n = Math.max(3, Math.floor(pl / 6));
      for (let k = 1; k <= n; k++) {
        const q = k / (n + 1);
        const lx = px + (ex - px) * q, ly = py + (ey - py) * q;
        const lw = (1 - q * 0.75) * pl * 0.2;
        ctx.fillStyle = rng.pick(col);
        ctx.beginPath();
        ctx.ellipse(lx + lw * 0.45, ly, lw, lw * 0.42, a * 0.25 + 0.6, 0, TAU);
        ctx.fill();
      }
    }
    side = -side;
  }
  ctx.restore();
}

function drawFlowers(ctx, [x0, y0, w, h], rng, kind) {
  ctx.save();
  ctx.translate(x0, y0);
  const stems = kind === 'yarrow' ? 3 : 4;
  for (let i = 0; i < stems; i++) {
    const bx = w * (0.3 + 0.4 * (i / Math.max(1, stems - 1))) + rng.range(-10, 10);
    const top = h * rng.range(0.12, 0.3);
    const lean = rng.range(-28, 28);
    const pts = [];
    for (let k = 0; k <= 8; k++) {
      const q = k / 8;
      pts.push([bx + lean * q * q, h - 6 - (h - 6 - top) * q]);
    }
    const stemCol = kind === 'seed' ? '#a99a6c' : '#4d5a30';
    strokePoly(ctx, pts, stemCol, 2.6, 1.4);
    const [tx, ty] = pts[pts.length - 1];
    if (kind === 'aster') {
      for (let k = 0; k < 3; k++) strokeLine(ctx, pts[3 + k][0], pts[3 + k][1], pts[3 + k][0] + rng.sign() * 16, pts[3 + k][1] + 6, '#56633a', 2);
      const heads = rng.int(1, 2);
      for (let k = 0; k < heads; k++) {
        const hx = tx + (k ? rng.range(-22, 22) : 0), hy = ty + (k ? rng.range(6, 20) : 0);
        const r = rng.range(12, 17);
        const petal = rng.pick(['#9a86c8', '#8b77bb', '#a996d4', '#b3a2d8']);
        for (let p = 0; p < 18; p++) {
          const a = (p / 18) * TAU + rng.range(-0.05, 0.05);
          ctx.fillStyle = petal;
          ctx.beginPath();
          ctx.ellipse(hx + Math.cos(a) * r * 0.55, hy + Math.sin(a) * r * 0.55, r * 0.5, r * 0.11, a, 0, TAU);
          ctx.fill();
        }
        ctx.fillStyle = '#d9a92f';
        ctx.beginPath();
        ctx.arc(hx, hy, r * 0.28, 0, TAU);
        ctx.fill();
      }
    } else if (kind === 'goldenrod') {
      const path = polyAlong(pts);
      for (let d = path.total * 0.45; d < path.total; d += 3) {
        const [x, y, ang] = path.at(d);
        const q = (d / path.total - 0.45) / 0.55;
        const n = Math.floor(2 + q * 3);
        for (let k = 0; k < n; k++) {
          const a = ang - Math.PI / 2 + rng.range(-1.2, 1.2);
          const dist = rng.range(2, 10 + 8 * (1 - q));
          ctx.fillStyle = rng.pick(['#d6ad30', '#e2bf45', '#c99c25', '#e8c95a']);
          ctx.beginPath();
          ctx.arc(x + Math.cos(a) * dist, y + Math.sin(a) * dist, rng.range(1.6, 2.8), 0, TAU);
          ctx.fill();
        }
      }
    } else if (kind === 'yarrow') {
      for (let k = 0; k < 4; k++) {
        const p = pts[2 + k];
        for (let j = 0; j < 6; j++) strokeLine(ctx, p[0], p[1], p[0] + rng.range(-14, 14), p[1] + rng.range(-4, 6), '#5a6a3a', 1);
      }
      for (let k = 0; k < 70; k++) {
        const a = rng() * TAU, r = Math.sqrt(rng()) * 24;
        ctx.fillStyle = rng.pick(['#ece5d2', '#f2ecdc', '#dcd3bd']);
        ctx.beginPath();
        ctx.arc(tx + Math.cos(a) * r, ty + Math.sin(a) * r * 0.45, rng.range(1.8, 3), 0, TAU);
        ctx.fill();
      }
    } else {
      const path = polyAlong(pts);
      for (let d = path.total * 0.5; d < path.total; d += 7) {
        const [x, y] = path.at(d);
        const s = rng.sign();
        const ex = x + s * rng.range(8, 16), ey = y + rng.range(8, 18);
        strokeLine(ctx, x, y, ex, ey, '#b8a77a', 1);
        ctx.fillStyle = rng.pick(['#c8b68a', '#bba776', '#d4c39a']);
        ctx.beginPath();
        ctx.ellipse(ex, ey, 2.4, 5, s * 0.5, 0, TAU);
        ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawTuft(ctx, [x0, y0, w, h], rng) {
  ctx.save();
  ctx.translate(x0, y0);
  const cols = ['#b7a36a', '#a2945c', '#c8b47a', '#8a8550', '#9f9a5e', '#7b7c47', '#c2ad70'];
  for (let i = 0; i < 90; i++) {
    const bx = w * 0.5 + rng.range(-34, 34);
    const lean = rng.range(-1, 1);
    const H = h * rng.range(0.5, 0.92);
    const ex = bx + lean * w * 0.42, ey = h - 4 - H * (1 - Math.abs(lean) * 0.35);
    const cx = bx + lean * w * 0.08, cy = h - 4 - H * 0.75;
    const col = rng.pick(cols);
    const segs = 4;
    let px = bx, py = h - 4;
    for (let k = 1; k <= segs; k++) {
      const t = k / segs;
      const x = (1 - t) * (1 - t) * bx + 2 * (1 - t) * t * cx + t * t * ex;
      const y = (1 - t) * (1 - t) * (h - 4) + 2 * (1 - t) * t * cy + t * t * ey;
      strokeLine(ctx, px, py, x, y, col, lerp(4.2, 1.0, t));
      px = x; py = y;
    }
  }
  ctx.restore();
}

// Fill transparent texels with the nearest opaque color (multi-source BFS) so mipmaps keep clean edges.
function dilateColors(data, w, h) {
  const n = w * h;
  const queue = new Int32Array(n);
  const seen = new Uint8Array(n);
  let head = 0, tail = 0;
  for (let i = 0; i < n; i++) {
    if (data[i * 4 + 3] > 24) { seen[i] = 1; queue[tail++] = i; }
  }
  if (tail === 0) return;
  while (head < tail) {
    const i = queue[head++];
    const x = i % w, y = (i / w) | 0;
    const nb = [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, y > 0 ? i - w : -1, y < h - 1 ? i + w : -1];
    for (const j of nb) {
      if (j < 0 || seen[j]) continue;
      seen[j] = 1;
      data[j * 4] = data[i * 4];
      data[j * 4 + 1] = data[i * 4 + 1];
      data[j * 4 + 2] = data[i * 4 + 2];
      queue[tail++] = j;
    }
  }
}

const SRGB_TO_LIN = (() => {
  const t = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const c = i / 255;
    t[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  return t;
})();
const linToSrgb8 = (v) => {
  const c = v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
  return Math.max(0, Math.min(255, Math.round(c * 255)));
};

// Mip chain whose alpha is rescaled so the alpha-tested coverage matches level 0 (foliage stays dense far away).
function coverageMips(data, w, h, ref = 0.5) {
  const coverage = (a, scale) => {
    let c = 0;
    const thr = ref / scale;
    for (let i = 0; i < a.length; i++) if (a[i] >= thr) c++;
    return c / a.length;
  };
  let cw = w, ch = h;
  let rgb = new Float32Array(w * h * 3), alpha = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    rgb[i * 3] = SRGB_TO_LIN[data[i * 4]];
    rgb[i * 3 + 1] = SRGB_TO_LIN[data[i * 4 + 1]];
    rgb[i * 3 + 2] = SRGB_TO_LIN[data[i * 4 + 2]];
    alpha[i] = data[i * 4 + 3] / 255;
  }
  const cov0 = coverage(alpha, 1);
  const levels = [{ data: new Uint8Array(data.buffer.slice(0)), width: w, height: h }];
  while (cw > 1 || ch > 1) {
    const nw = Math.max(1, cw >> 1), nh = Math.max(1, ch >> 1);
    const nrgb = new Float32Array(nw * nh * 3), na = new Float32Array(nw * nh);
    for (let y = 0; y < nh; y++) {
      for (let x = 0; x < nw; x++) {
        let r = 0, g = 0, b = 0, a = 0, wsum = 0;
        for (let dy = 0; dy < 2; dy++) {
          for (let dx = 0; dx < 2; dx++) {
            const sx = Math.min(cw - 1, x * 2 + dx), sy = Math.min(ch - 1, y * 2 + dy);
            const si = sy * cw + sx;
            const wa = alpha[si] + 0.02;
            r += rgb[si * 3] * wa; g += rgb[si * 3 + 1] * wa; b += rgb[si * 3 + 2] * wa;
            wsum += wa;
            a += alpha[si];
          }
        }
        const di = y * nw + x;
        nrgb[di * 3] = r / wsum; nrgb[di * 3 + 1] = g / wsum; nrgb[di * 3 + 2] = b / wsum;
        na[di] = a / 4;
      }
    }
    let lo = 0.5, hi = 6, scale = 1;
    for (let it = 0; it < 14; it++) {
      scale = (lo + hi) / 2;
      if (coverage(na, scale) < cov0) lo = scale; else hi = scale;
    }
    const out = new Uint8Array(nw * nh * 4);
    for (let i = 0; i < nw * nh; i++) {
      out[i * 4] = linToSrgb8(nrgb[i * 3]);
      out[i * 4 + 1] = linToSrgb8(nrgb[i * 3 + 1]);
      out[i * 4 + 2] = linToSrgb8(nrgb[i * 3 + 2]);
      out[i * 4 + 3] = Math.min(255, Math.round(na[i] * scale * 255));
    }
    levels.push({ data: out, width: nw, height: nh });
    rgb = nrgb; alpha = na; cw = nw; ch = nh;
  }
  return levels;
}

function buildPlantAtlas(renderer) {
  const rng = makeRng('atlas');
  const S = ATLAS_SIZE;
  const cv = document.createElement('canvas');
  cv.width = S;
  cv.height = S;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.clearRect(0, 0, S, S);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ATLAS_CELLS.fir.forEach((r) => drawFirSpray(ctx, r, rng));
  ATLAS_CELLS.pine.forEach((r) => drawPineTuft(ctx, r, rng));
  ATLAS_CELLS.birch.forEach((r) => drawLeafCluster(ctx, r, rng, 'birch'));
  ATLAS_CELLS.maple.forEach((r) => drawLeafCluster(ctx, r, rng, 'maple'));
  ATLAS_CELLS.fern.forEach((r) => drawFern(ctx, r, rng));
  ['aster', 'goldenrod', 'yarrow', 'seed'].forEach((k, i) => drawFlowers(ctx, ATLAS_CELLS.flower[i], rng, k));
  const singles = [['birch', '#d9b13a'], ['birch', '#b9ab3c'], ['maple', '#c2402a'], ['maple', '#dd7a2c'], ['aspen', '#d8a733'], ['oak', '#8a5a2e'], ['willow', '#cfa53a'], ['oak', '#a06a34']];
  singles.forEach(([kind, color], i) => {
    const [x, y, w, h] = ATLAS_CELLS.leaf[i];
    drawLeaf(ctx, x + w * 0.5, y + h * 0.92, -Math.PI / 2, h * 0.86, kind, color, rng);
  });
  drawLeafCluster(ctx, ATLAS_CELLS.shrub[0], rng, 'shrub');
  drawTuft(ctx, ATLAS_CELLS.tuft[0], rng);

  const img = ctx.getImageData(0, 0, S, S);
  dilateColors(img.data, S, S);
  const levels = coverageMips(img.data, S, S, 0.5);
  const tex = new THREE.DataTexture(levels[0].data, S, S, THREE.RGBAFormat, THREE.UnsignedByteType);
  tex.mipmaps = levels;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  tex.flipY = false;
  tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  tex.needsUpdate = true;
  return tex;
}

function buildClothTexture() {
  const S = 512;
  const cv = document.createElement('canvas');
  cv.width = S;
  cv.height = S;
  const ctx = cv.getContext('2d');
  const q = S / 2;
  // plaid
  ctx.fillStyle = '#e6d8be';
  ctx.fillRect(0, 0, q, q);
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = 'rgba(150, 48, 38, 0.82)';
    ctx.fillRect(i * 32 + 4, 0, 14, q);
    ctx.fillRect(0, i * 32 + 4, q, 14);
    ctx.fillStyle = 'rgba(40, 46, 60, 0.5)';
    ctx.fillRect(i * 32 + 22, 0, 3, q);
    ctx.fillRect(0, i * 32 + 22, q, 3);
  }
  // stripes
  ctx.fillStyle = '#e9e4d8';
  ctx.fillRect(q, 0, q, q);
  for (let i = 0; i < 16; i++) {
    ctx.fillStyle = i % 4 === 0 ? '#36506f' : '#58739a';
    ctx.fillRect(q + i * 16, 0, i % 4 === 0 ? 6 : 3, q);
  }
  // quilt
  const quilt = ['#b8873c', '#7f8a5a', '#a85a3a', '#e3d6b8', '#53698a', '#c9a76a'];
  const rng = makeRng('cloth');
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    ctx.fillStyle = rng.pick(quilt);
    ctx.fillRect(x * 32, q + y * 32, 32, 32);
    ctx.strokeStyle = 'rgba(60, 40, 30, 0.35)';
    ctx.strokeRect(x * 32 + 1, q + y * 32 + 1, 30, 30);
  }
  // linen
  ctx.fillStyle = '#ebe5d8';
  ctx.fillRect(q, q, q, q);
  for (let i = 0; i < 1400; i++) {
    ctx.fillStyle = rng.chance(0.5) ? 'rgba(200, 190, 170, 0.25)' : 'rgba(255, 255, 255, 0.25)';
    ctx.fillRect(q + rng() * q, q + rng() * q, rng.range(2, 9), 1);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function buildTextures(renderer) {
  const baker = new TextureBaker(renderer);
  const T = {};
  T.barkMap = withRepeat(baker.bake('bark', { size: 512, srgb: true }), TEX_SIZE.bark);
  T.barkNormal = withRepeat(baker.bake('bark', { size: 512, normal: true, strength: 5 }), TEX_SIZE.bark);
  T.birchMap = withRepeat(baker.bake('birch', { size: 512, srgb: true }), TEX_SIZE.birch);
  T.birchNormal = withRepeat(baker.bake('birch', { size: 512, normal: true, strength: 3 }), TEX_SIZE.birch);
  T.woodMap = withRepeat(baker.bake('wood', { size: 1024, srgb: true }), TEX_SIZE.wood);
  T.woodNormal = withRepeat(baker.bake('wood', { size: 1024, normal: true, strength: 3 }), TEX_SIZE.wood);
  T.endMap = baker.bake('endgrain', { size: 512, srgb: true, wrap: THREE.ClampToEdgeWrapping });
  T.endNormal = baker.bake('endgrain', { size: 512, normal: true, strength: 4, wrap: THREE.ClampToEdgeWrapping });
  T.stoneMap = withRepeat(baker.bake('stone', { size: 512, srgb: true }), TEX_SIZE.stone);
  T.stoneNormal = withRepeat(baker.bake('stone', { size: 512, normal: true, strength: 4 }), TEX_SIZE.stone);
  T.ground = baker.bake('ground', { size: 1024 });
  T.noise = baker.bake('noise', { size: 256 });
  T.smoke = baker.bake('smoke', { size: 128, wrap: THREE.ClampToEdgeWrapping });
  T.atlas = buildPlantAtlas(renderer);
  T.cloth = buildClothTexture();
  T.baker = baker;
  return T;
}

/* World: terrain height field, the path and the creek, ground masks, terrain meshes and creek water.
   Layout (meters): the cabin sits at the origin facing +Z; the meadow clearing is an ellipse around it;
   the creek runs from the back-left to the front-right and crosses the path on a plank bridge. */

const WORLD = {
  clearing: { cx: -1, cz: 5, rx: 21, rz: 25 },
  maskRect: { x0: -120, z0: -120, size: 240 },
  maskRes: 1024,
  sunAzDusk: -106,     // degrees; the meadow corridor along the creek valley keeps this sunline open
  sunElDusk: 8,
  creekDepth: 0.42,
};

const PATH_POINTS = [[0, 5.7], [0.25, 8.4], [1.5, 12.3], [1.9, 16.8], [0.4, 21.3], [-2.2, 25.8], [-4.2, 30.6], [-4.9, 35.6], [-3.9, 41.5], [-1.4, 49.5], [1.4, 59.5], [2.9, 71], [2.1, 85], [-0.8, 99], [-3, 117]];
const CREEK_POINTS = [[-118, -47], [-96, -36], [-73, -24], [-53, -10], [-38.5, 4], [-27, 15], [-16.5, 24.5], [-6.5, 32.5], [5, 38.8], [18, 44], [32, 49.5], [48, 57], [64, 66.5], [82, 75.5], [100, 82.5], [118, 87]];

// Centripetal-ish Catmull-Rom through 2D points, resampled to roughly `step` meters.
function sampleSpline2D(points, step = 0.5) {
  const v = points.map((p) => new THREE.Vector3(p[0], 0, p[1]));
  const curve = new THREE.CatmullRomCurve3(v, false, 'centripetal');
  const length = curve.getLength();
  const n = Math.max(2, Math.ceil(length / step));
  const pts = curve.getSpacedPoints(n).map((p) => [p.x, p.z]);
  const len = [0];
  for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, len, total: len[len.length - 1] };
}

// Distance (and arc-length parameter) to a polyline, stored on a grid; only cells within maxD are touched.
class DistField {
  constructor(res, rect, maxD, withT = false) {
    this.res = res;
    this.x0 = rect.x0; this.z0 = rect.z0;
    this.cell = rect.size / res;
    this.maxD = maxD;
    this.d = new Float32Array(res * res).fill(maxD);
    this.t = withT ? new Float32Array(res * res) : null;
  }
  stamp(poly) {
    const { res, x0, z0, cell, maxD } = this;
    for (let i = 0; i < poly.pts.length - 1; i++) {
      const [ax, az] = poly.pts[i], [bx, bz] = poly.pts[i + 1];
      const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz || 1e-6;
      const i0 = Math.max(0, Math.floor((Math.min(ax, bx) - maxD - x0) / cell));
      const i1 = Math.min(res - 1, Math.ceil((Math.max(ax, bx) + maxD - x0) / cell));
      const j0 = Math.max(0, Math.floor((Math.min(az, bz) - maxD - z0) / cell));
      const j1 = Math.min(res - 1, Math.ceil((Math.max(az, bz) + maxD - z0) / cell));
      const l0 = poly.len[i], l1 = poly.len[i + 1];
      for (let j = j0; j <= j1; j++) {
        const pz = z0 + (j + 0.5) * cell;
        for (let k = i0; k <= i1; k++) {
          const px = x0 + (k + 0.5) * cell;
          let h = ((px - ax) * dx + (pz - az) * dz) / L2;
          h = h < 0 ? 0 : h > 1 ? 1 : h;
          const ex = px - ax - dx * h, ez = pz - az - dz * h;
          const d = Math.sqrt(ex * ex + ez * ez);
          const idx = j * res + k;
          if (d < this.d[idx]) {
            this.d[idx] = d;
            if (this.t) this.t[idx] = l0 + h * (l1 - l0);
          }
        }
      }
    }
  }
  _bilinear(arr, x, z, fallback) {
    const fx = (x - this.x0) / this.cell - 0.5, fz = (z - this.z0) / this.cell - 0.5;
    const i = Math.floor(fx), j = Math.floor(fz);
    if (i < 0 || j < 0 || i >= this.res - 1 || j >= this.res - 1) return fallback;
    const tx = fx - i, tz = fz - j, r = this.res;
    const a = arr[j * r + i], b = arr[j * r + i + 1], c = arr[(j + 1) * r + i], d = arr[(j + 1) * r + i + 1];
    return (a * (1 - tx) + b * tx) * (1 - tz) + (c * (1 - tx) + d * tx) * tz;
  }
  dist(x, z) { return this._bilinear(this.d, x, z, this.maxD); }
  param(x, z) {
    const fx = Math.round((x - this.x0) / this.cell - 0.5), fz = Math.round((z - this.z0) / this.cell - 0.5);
    if (fx < 0 || fz < 0 || fx >= this.res || fz >= this.res) return 0;
    return this.t[fz * this.res + fx];
  }
}

const World = {
  path: null, creek: null,
  pathField: null, creekField: null, creekWide: null,
  water: null, waterStep: 1,
  H0: 0, cabinY: 0,
  grid: null,
  mask: null, maskTex: null,

  ellipse(x, z) {
    const c = WORLD.clearing;
    return Math.hypot((x - c.cx) / c.rx, (z - c.cz) / c.rz);
  },

  corridor(x, z) {
    const d = Math.hypot(x, z);
    if (d < 18) return 0;
    const az = Math.atan2(x, z) / DEG;
    const da = Math.abs(((az - WORLD.sunAzDusk + 540) % 360) - 180);
    return (1 - smoothstep(8, 15, da)) * smoothstep(18, 32, d);
  },

  rawHeight(x, z) {
    let h = -0.035 * z - 0.012 * x;
    h += Noise.fbm2(x * 0.0065 + 3.1, z * 0.0065 - 1.7, 4) * 9.0;
    h += Noise.fbm2(x * 0.021 - 7.3, z * 0.021 + 2.2, 3) * 2.0;
    const back = smoothstep(-25, -165, z);
    h += back * back * 22.0;
    h += smoothstep(55, 190, Math.abs(x - 8)) * 9.0;
    return h;
  },

  creekHalfWidth(t) {
    return 1.15 + 0.3 * Math.sin(t * 0.045 + 1.3) + 0.15 * Math.sin(t * 0.13);
  },

  baseHeight(x, z) {
    let h = this.rawHeight(x, z);
    // keep the low evening sun visible from the cabin: cap the terrain along the corridor
    const cw = this.corridor(x, z);
    if (cw > 0) {
      const cap = this.H0 + Math.hypot(x, z) * Math.tan(3.2 * DEG);
      if (h > cap) h = lerp(h, cap, cw);
    }
    // a soft valley follows the creek
    if (this.creekWide) {
      const dv = this.creekWide.dist(x, z);
      h -= 1.6 * (1 - smoothstep(4, 30, dv));
    }
    // the meadow is a gentle, slightly tilted plane
    const e = this.ellipse(x, z);
    const k = smoothstep(0.72, 1.4, e);
    const c = WORLD.clearing;
    const plane = this.H0 - 0.028 * (z - c.cz) - 0.012 * (x - c.cx) + Noise.fbm2(x * 0.05 + 11, z * 0.05 - 4, 2) * 0.35 * smoothstep(0.25, 0.7, e);
    h = lerp(plane, h, k);
    // the path is worn a little into the ground
    if (this.pathField) {
      const dp = this.pathField.dist(x, z);
      h -= 0.06 * (1 - smoothstep(0.2, 1.3, dp));
    }
    h += Noise.n2(x * 0.33, z * 0.33) * 0.06 + Noise.n2(x * 1.1 + 5, z * 1.1) * 0.02;
    return h;
  },

  waterAt(t) {
    const w = this.water;
    const f = clamp(t / this.waterStep, 0, w.length - 1);
    const i = Math.min(w.length - 2, Math.floor(f));
    return lerp(w[i], w[i + 1], f - i);
  },

  heightFn(x, z) {
    let h = this.baseHeight(x, z);
    const d = this.creekField.dist(x, z);
    if (d < this.creekField.maxD - 0.01) {
      const t = this.creekField.param(x, z);
      const water = this.waterAt(t);
      const hw = this.creekHalfWidth(t);
      const bed = water - WORLD.creekDepth;
      const carved = d < hw ? bed + (d / hw) * (d / hw) * (WORLD.creekDepth + 0.1) : water + 0.1 + (d - hw) * 0.5;
      if (carved < h) h = lerp(h, carved, 1 - smoothstep(this.creekField.maxD - 1.5, this.creekField.maxD, d));
    }
    return h;
  },

  // Height on the rendered surface (exact triangle interpolation inside the dense grid).
  heightAt(x, z) {
    const g = this.grid;
    if (g) {
      const fx = (x - g.x0) / g.step, fz = (z - g.z0) / g.step;
      const i = Math.floor(fx), j = Math.floor(fz);
      if (i >= 0 && j >= 0 && i < g.n && j < g.n) {
        const tx = fx - i, tz = fz - j, w = g.n + 1, H = g.h;
        const a = H[j * w + i], b = H[j * w + i + 1], c = H[(j + 1) * w + i], d = H[(j + 1) * w + i + 1];
        return tx + tz <= 1 ? a + (b - a) * tx + (c - a) * tz : d + (c - d) * (1 - tx) + (b - d) * (1 - tz);
      }
    }
    return this.heightFn(x, z);
  },

  normalAt(x, z, out = new THREE.Vector3()) {
    const e = 0.35;
    const hx = this.heightAt(x + e, z) - this.heightAt(x - e, z);
    const hz = this.heightAt(x, z + e) - this.heightAt(x, z - e);
    return out.set(-hx, 2 * e, -hz).normalize();

  // Ground classification for placement: 0..1 weights sampled from the CPU copy of the mask.
  maskAt(x, z) {
    const r = WORLD.maskRect, res = WORLD.maskRes;
    const i = Math.floor(((x - r.x0) / r.size) * res), j = Math.floor(((z - r.z0) / r.size) * res);
    if (i < 0 || j < 0 || i >= res || j >= res) return { path: 0, wet: 0, meadow: 0, ao: 1 };
    const k = (j * res + i) * 4, m = this.mask;
    return { path: m[k] / 255, wet: m[k + 1] / 255, meadow: m[k + 2] / 255, ao: m[k + 3] / 255 };
  },
  pathDist(x, z) { return this.pathField.dist(x, z); },
  creekDist(x, z) { return this.creekField.dist(x, z); },
  creekWideDist(x, z) { return this.creekWide.dist(x, z); },

  // Darken the ground around an object (contact shadow / ambient occlusion) in the mask's alpha.
  addAO(x, z, radius, strength = 0.5, squash = 1) {
    const r = WORLD.maskRect, res = WORLD.maskRes, cell = r.size / res;
    const i0 = Math.max(0, Math.floor((x - radius - r.x0) / cell)), i1 = Math.min(res - 1, Math.ceil((x + radius - r.x0) / cell));
    const j0 = Math.max(0, Math.floor((z - radius * squash - r.z0) / cell)), j1 = Math.min(res - 1, Math.ceil((z + radius * squash - r.z0) / cell));
    const m = this.mask;
    for (let j = j0; j <= j1; j++) {
      for (let i = i0; i <= i1; i++) {

        const k = (j * res + i) * 4 + 3;
        const f = 1 - strength * Math.pow(1 - d, 1.6);

  },
  addAORect(cx, cz, hw, hd, falloff, strength) {
    const r = WORLD.maskRect, res = WORLD.maskRes, cell = r.size / res;
    const i0 = Math.max(0, Math.floor((cx - hw - falloff - r.x0) / cell)), i1 = Math.min(res - 1, Math.ceil((cx + hw + falloff - r.x0) / cell));
    const j0 = Math.max(0, Math.floor((cz - hd - falloff - r.z0) / cell)), j1 = Math.min(res - 1, Math.ceil((cz + hd + falloff - r.z0) / cell));
    for (let j = j0; j <= j1; j++) {
      for (let i = i0; i <= i1; i++) {
        const px = r.x0 + (i + 0.5) * cell, pz = r.z0 + (j + 0.5) * cell;

  commitMask() {

  build() {
    const c = WORLD.clearing;
    this.H0 = this.rawHeight(c.cx, c.cz);
    this.path = sampleSpline2D(PATH_POINTS, 0.5);
    this.creek = sampleSpline2D(CREEK_POINTS, 0.5);

    this.pathField = new DistField(WORLD.maskRes, WORLD.maskRect, 7, true);
    this.pathField.stamp(this.path);
    this.creekWide = new DistField(256, WORLD.maskRect, 34, false);
    this.creekWide.stamp(this.creek);

    // water surface: always at least 0.38 m below the ground along the creek, never flowing uphill
    const step = 1.0;
    const n = Math.ceil(this.creek.total / step) + 1;
    const curve = new THREE.CatmullRomCurve3(CREEK_POINTS.map((p) => new THREE.Vector3(p[0], 0, p[1])), false, 'centripetal');
    const water = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const p = curve.getPointAt(Math.min(1, (i * step) / this.creek.total));
      let lowest = Infinity;
      for (const o of [-1.2, 0, 1.2]) lowest = Math.min(lowest, this.baseHeight(p.x + o, p.z + o * 0.6) - 0.36);
      water[i] = i === 0 ? lowest : Math.min(water[i - 1] - 0.004 * step, lowest);
    }
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 1; i < n - 1; i++) water[i] = Math.min(water[i], (water[i - 1] + water[i] + water[i + 1]) / 3);
      for (let i = 1; i < n; i++) water[i] = Math.min(water[i], water[i - 1] - 0.002);
    }
    this.water = water;
    this.waterStep = step;
    this.creekField = new DistField(WORLD.maskRes, WORLD.maskRect, 8, true);
    this.creekField.stamp(this.creek);
    this.cabinY = this.heightFn(0, 0);

    this.buildMask();
  },

  buildMask() {
    const res = WORLD.maskRes, r = WORLD.maskRect, cell = r.size / res;
    const m = new Uint8Array(res * res * 4);
    for (let j = 0; j < res; j++) {
      const z = r.z0 + (j + 0.5) * cell;
      for (let i = 0; i < res; i++) {
        const x = r.x0 + (i + 0.5) * cell;
        const k = (j * res + i) * 4;
        const dp = this.pathField.d[j * res + i];
        const pw = 0.75 + 0.25 * smoothstep(20, 60, this.pathField.t[j * res + i]);
        const path = 1 - smoothstep(pw * 0.55, pw + 0.55, dp);
        const dc = this.creekField.d[j * res + i];
        const wet = 1 - smoothstep(1.3, 3.4, dc);
        const e = this.ellipse(x, z);
        let meadow = 1 - smoothstep(0.82, 1.22, e);
        const dv = this.creekWide.dist(x, z);
        meadow = Math.max(meadow, (1 - smoothstep(5, 16, dv)) * 0.75);
        meadow = Math.max(meadow, this.corridor(x, z) * (1 - smoothstep(30, 90, Math.hypot(x, z))) * 0.8);
        m[k] = Math.round(path * 255);
        m[k + 1] = Math.round(wet * 255);
        m[k + 2] = Math.round(meadow * 255);
        m[k + 3] = 255;
      }

    const tex = new THREE.DataTexture(m, res, res, THREE.RGBAFormat, THREE.UnsignedByteType);

    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.generateMipmaps = true;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;

    this.maskTex = tex;
  },

  buildTerrain(T) {
    const c = WORLD.clearing;
    const step = 0.5, half = 76;
    const n = Math.round((half * 2) / step);
    const x0 = c.cx - half, z0 = c.cz - half;
    const w = n + 1;
    const H = new Float32Array(w * w);
    const pos = new Float32Array(w * w * 3);
    for (let j = 0; j <= n; j++) {
      for (let i = 0; i <= n; i++) {
        const x = x0 + i * step, z = z0 + j * step;
        const h = this.heightFn(x, z);
        H[j * w + i] = h;
        const k = (j * w + i) * 3;

    }
    const idx = new Uint32Array(n * n * 6);
    let p = 0;
    for (let j = 0; j < n; j++) {
      for (let i = 0; i < n; i++) {
        const a = j * w + i, b = a + 1, cc = a + w, d = cc + 1;
        idx[p++] = a; idx[p++] = cc; idx[p++] = b;
        idx[p++] = b; idx[p++] = cc; idx[p++] = d;

    inner.setIndex(new THREE.BufferAttribute(idx, 1));

    rings.push(700);

      for (let s = 0; s <= seg; s++) {
        const a = (s / seg) * TAU;
        const x = c.cx + Math.cos(a) * rings[ri], z = c.cz + Math.sin(a) * rings[ri];
        const cheb = Math.max(Math.abs(x - c.cx), Math.abs(z - c.cz));

    const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const r = WORLD.maskRect;
    patchMaterial(mat, {
      uniforms: {
        uMask: { value: this.maskTex },
        uMaskRect: { value: new THREE.Vector4(r.x0, r.z0, 1 / r.size, 0) },
        uGround: { value: T.ground },
        uNoiseTex: { value: T.noise },
      },
      fsPars: /* glsl */ `
uniform sampler2D uMask;
uniform vec4 uMaskRect;
uniform sampler2D uGround;
uniform sampler2D uNoiseTex;`,
      fsColor: /* glsl */ `
{
  vec2 muv = (vWorldPos.xz - uMaskRect.xy) * uMaskRect.z;
  vec4 m = (muv.x > 0.0 && muv.y > 0.0 && muv.x < 1.0 && muv.y < 1.0) ? texture2D(uMask, muv) : vec4(0.0, 0.0, 0.0, 1.0);
  vec4 g = texture2D(uGround, vWorldPos.xz * 0.25);
  vec4 g2 = texture2D(uGround, vWorldPos.xz * 0.061 + 0.37);
  vec4 nz = texture2D(uNoiseTex, vWorldPos.xz * 0.006);
  vec4 nz2 = texture2D(uNoiseTex, vWorldPos.xz * 0.045 + 0.5);
  vec3 forest = mix(vec3(0.062, 0.042, 0.027), vec3(0.12, 0.075, 0.042), g.r);
  forest = mix(forest, vec3(0.2, 0.11, 0.048), g.g * (0.55 + 0.45 * nz2.r));
  forest = mix(forest, vec3(0.07, 0.085, 0.032), smoothstep(0.55, 0.78, nz2.b) * 0.65);
  vec3 meadow = mix(vec3(0.085, 0.078, 0.033), vec3(0.15, 0.125, 0.055), g.b);
  meadow = mix(meadow, vec3(0.07, 0.08, 0.03), smoothstep(0.35, 0.75, nz.b) * 0.6);
  meadow = mix(meadow, forest, g.g * 0.25);
  vec3 dirt = mix(vec3(0.14, 0.095, 0.06), vec3(0.22, 0.155, 0.1), g.r);
  dirt = mix(dirt, vec3(0.3, 0.27, 0.23), g.a * 0.85);
  vec3 wet = mix(vec3(0.06, 0.048, 0.032), vec3(0.12, 0.095, 0.06), g.r);
  wet = mix(wet, vec3(0.22, 0.2, 0.17), g.a * 0.75);
  float pathAmt = smoothstep(0.3, 0.75, m.r + (g2.r - 0.5) * 0.5 + (g.a - 0.3) * 0.2);
  float meadowAmt = smoothstep(0.15, 0.85, m.b + (nz2.r - 0.5) * 0.3);
  vec3 col = mix(forest, meadow, meadowAmt);
  col = mix(col, dirt, pathAmt);

    });
    // the creek mirror gets a 1 m version of the dense grid (layer 2); the main camera draws the full one (layer 1)
    const cn = n / 2, cw = cn + 1;
    const cpos = new Float32Array(cw * cw * 3);
    for (let j = 0; j <= cn; j++) {
      for (let i = 0; i <= cn; i++) {
        const k = (j * cw + i) * 3, src = (j * 2 * w + i * 2) * 3;
        cpos[k] = pos[src]; cpos[k + 1] = pos[src + 1]; cpos[k + 2] = pos[src + 2];
      }
    }
    const cidx = new Uint32Array(cn * cn * 6);
    p = 0;
    for (let j = 0; j < cn; j++) {
      for (let i = 0; i < cn; i++) {
        const a = j * cw + i, b = a + 1, cc = a + cw, d = cc + 1;
        cidx[p++] = a; cidx[p++] = cc; cidx[p++] = b;
        cidx[p++] = b; cidx[p++] = cc; cidx[p++] = d;
      }
    }
    const coarse = new THREE.BufferGeometry();
    coarse.setAttribute('position', new THREE.BufferAttribute(cpos, 3));
    coarse.setIndex(new THREE.BufferAttribute(cidx, 1));
    coarse.computeVertexNormals();

    const group = new THREE.Group();
    const innerMesh = new THREE.Mesh(inner, mat);
    const outerMesh = new THREE.Mesh(outer, mat);
    const coarseMesh = new THREE.Mesh(coarse, mat);
    innerMesh.layers.set(1);
    coarseMesh.layers.set(2);
    for (const m of [innerMesh, outerMesh, coarseMesh]) {
      m.receiveShadow = true;
      m.castShadow = false;
      group.add(m);
    }
    group.name = 'terrain';
    return group;
  },

  buildWater(T) {
    const poly = sampleSpline2D(CREEK_POINTS, 0.6);
    this.creekSamples = [];
    const cols = 6;
    const pos = [], uv = [], flow = [], idx = [];
    const r = WORLD.maskRect;
    let rows = 0;
    for (let i = 0; i < poly.pts.length; i++) {
      const [x, z] = poly.pts[i];
      if (x < r.x0 + 4 || x > r.x0 + r.size - 4 || z < r.z0 + 4 || z > r.z0 + r.size - 4) continue;
      const a = poly.pts[Math.max(0, i - 1)], b = poly.pts[Math.min(poly.pts.length - 1, i + 1)];
      let tx = b[0] - a[0], tz = b[1] - a[1];
      const tl = Math.hypot(tx, tz) || 1;
      tx /= tl; tz /= tl;
      const t = poly.len[i];
      const hw = this.creekHalfWidth(t) + 0.45;
      const y = this.waterAt(t) - 0.02;
      if (rows % 3 === 0) this.creekSamples.push([x, y, z]);
      for (let c = 0; c <= cols; c++) {
        const s = (c / cols) * 2 - 1;
        pos.push(x - tz * hw * s, y, z + tx * hw * s);
        uv.push(c / cols, t);
        flow.push(tx, tz);
      }
      rows++;
    }
    for (let j = 0; j < rows - 1; j++) {
      for (let c = 0; c < cols; c++) {
        const a = j * (cols + 1) + c, b = a + 1, cc = a + cols + 1, d = cc + 1;
        idx.push(a, b, cc, b, d, cc);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(new Array(pos.length).fill(0).map((_, i) => (i % 3 === 1 ? 1 : 0)), 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setAttribute('aFlow', new THREE.Float32BufferAttribute(flow, 2));
    geo.setIndex(idx);

    // The surface is lit by three (sun glints with shadows, ambient for the water body) but composes its
    // own premultiplied output: reflection by Fresnel on top, the bed showing through the shallows.
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0, transparent: true, envMapIntensity: 1.0 });
    mat.blending = THREE.CustomBlending;
    mat.blendSrc = THREE.OneFactor;
    mat.blendDst = THREE.OneMinusSrcAlphaFactor;
    patchMaterial(mat, {
      noAtmos: true,
      uniforms: { uNoiseTex: { value: T.noise }, uWaterTint: { value: lin('#0f1d19') }, uFoliageLit: U.uFoliageLit, ...CreekMirror.uniforms },
      vsPars: 'attribute vec2 aFlow;\nuniform mat4 uReflMat;\nvarying vec2 vFlow;\nvarying vec2 vWUv;\nvarying vec4 vReflCoord;',
      vsWorld: 'vFlow = aFlow; vWUv = uv; vReflCoord = uReflMat * vec4(pmWorld.xyz, 1.0);',
      fsPars: /* glsl */ `
uniform sampler2D uNoiseTex;
uniform vec3 uWaterTint;
uniform vec3 uFoliageLit;
uniform sampler2D uReflTex;
uniform float uReflOn;
varying vec4 vReflCoord;
varying vec2 vFlow;
varying vec2 vWUv;
vec3 wN;
float waterH(vec2 p) {
  float a = texture2D(uNoiseTex, p * 0.35).g;
  float b = texture2D(uNoiseTex, p * 0.9 + 0.31).r;
  return a * 0.6 + b * 0.4;
}`,
      fsNormal: /* glsl */ `
{
  // ripples: a handful of wavelets carried downstream by the current (q is in meters: across, along);
  // the short ones fade where a pixel would cover them, so the surface never aliases into streaks
  float mid = 1.0 - abs(vWUv.x * 2.0 - 1.0);
  float speed = 0.35 + 0.5 * mid;
  vec2 q = vec2(vWUv.x * 3.2, vWUv.y);
  float fw = length(fwidth(q));
  vec2 qa = q - vec2(0.0, uTime * speed);
  vec2 grad = vec2(0.0);
  for (int i = 0; i < 6; i++) {
    float fi = float(i);
    float ang = sin(fi * 2.399 + 0.6) * 0.45;
    vec2 dir = vec2(sin(ang), cos(ang));
    float wl = 1.2 * pow(0.7, fi);
    float k = 6.2831 / wl;
    float steep = mix(0.02, 0.012, fi / 5.0) * (1.0 - smoothstep(wl * 0.08, wl * 0.3, fw));
    float ph = dot(qa, dir) * k + fi * 1.7 + vnoise(q * vec2(1.6, 0.7) + fi * 3.1) * 3.2;
    grad += dir * steep * cos(ph);
  }
  grad *= (0.6 + 0.4 * mid) * mix(0.55, 1.0, uReflOn);
  vec3 tangentAcross = vec3(-vFlow.y, 0.0, vFlow.x);
  vec3 tangentAlong = vec3(vFlow.x, 0.0, vFlow.y);
  wN = normalize(vec3(0.0, 1.0, 0.0) - tangentAcross * grad.x - tangentAlong * grad.y);
  normal = normalize((viewMatrix * vec4(wN, 0.0)).xyz);
}`,
      fsOut: /* glsl */ `
{
  vec3 V = normalize(cameraPosition - vWorldPos);
  float NdV = clamp(dot(wN, V), 0.0, 1.0);
  float F = 0.02 + 0.98 * pow(1.0 - NdV, 5.0);
  vec3 R = reflect(-V, wN);
  R.y = max(R.y, 0.02);
  R = normalize(R);
  vec3 sky = atmosColor(R);
#ifdef USE_ENVMAP
  sky = textureCubeUV(envMap, envMapRotation * R, 0.06).rgb * envMapIntensity;
#endif
  // the forest around the creek mirrored: a ragged treeline over sunlit crowns (golden birch among dark
  // spruce) that dissolve into the haze toward the horizon; smooth at crown scale so ripples only bend it
  float az = atan(R.x, R.z);
  float tl = 0.44 + 0.2 * (vnoise(vec2(az * 1.4, 0.5)) - 0.5) + 0.08 * (vnoise(vec2(az * 4.5, 3.5)) - 0.5);
  float forestMask = 1.0 - smoothstep(tl - 0.05, tl + 0.05, R.y);
  vec3 atm = atmosColor(R);
  float crowns = vnoise(vec2(az * 4.0, R.y * 5.0 + 1.3)) * 0.7 + vnoise(vec2(az * 9.0, R.y * 11.0)) * 0.3;
  float golden = smoothstep(0.3, 0.7, vnoise(vec2(az * 1.1 + 5.0, 2.0)));
  vec3 hR = normalize(vec3(R.x, 0.0, R.z) + 1e-4);
  vec3 hS = normalize(vec3(uScatterDir.x, 0.0, uScatterDir.z) + 1e-4);
  float back = pow(max(dot(hR, hS), 0.0), 4.0);
  // low in the mirror it is trunks and understory; the lit crowns only come in higher up
  vec3 albedo = mix(vec3(0.06, 0.085, 0.045), vec3(0.5, 0.34, 0.08), golden);
  vec3 crownsLit = uFoliageLit * albedo * mix(0.4, 1.0, crowns) * (1.0 + 0.8 * back);
  vec3 understory = uFoliageLit * vec3(0.03, 0.035, 0.025);
  vec3 forest = mix(understory, crownsLit, smoothstep(0.12, 0.42, R.y));
  float depthCue = exp(-R.y / tl * 2.6);
  forest = mix(forest, atm * 0.8, depthCue * 0.6);
  vec3 refl = mix(sky, forest, forestMask);
  // the dark banks and their grass are what the margins mirror
  float midR = 1.0 - abs(vWUv.x * 2.0 - 1.0);
  refl *= mix(0.15, 1.0, smoothstep(0.05, 0.55, midR));
  // close up, the real mirror image (bent by the ripples) replaces the stand-in
  if (uReflOn > 0.0) {
    vec2 ruv = clamp(vReflCoord.xy / vReflCoord.w + wN.xz * 0.2, vec2(0.002), vec2(0.998));
    refl = mix(refl, texture2D(uReflTex, ruv).rgb, uReflOn);
  }

  // water body (dark, tea-tinted) lit like everything else; the bed shows through the shallows
  vec3 irr = reflectedLight.directDiffuse + reflectedLight.indirectDiffuse;
  float mid = 1.0 - abs(vWUv.x * 2.0 - 1.0);
  float bodyA = mix(0.2, 0.62, smoothstep(0.15, 0.75, mid));
  vec3 col = refl * F + irr * uWaterTint * (1.0 - F) * bodyA + reflectedLight.directSpecular;
  float alpha = F + (1.0 - F) * bodyA;

  // foam along the banks and slow streaks on the current
  float foam = smoothstep(0.58, 0.8, waterH(vec2(vWUv.x * 6.0, vWUv.y * 1.6 - uTime * 0.9))) * (smoothstep(0.3, 0.08, vWUv.x) + smoothstep(0.7, 0.92, vWUv.x));
  float streak = smoothstep(0.7, 0.9, waterH(vec2(vWUv.x * 2.2, vWUv.y * 0.35 - uTime * 0.55))) * 0.35 * mid;
  float fa = clamp(foam * 0.3 + streak * 0.15, 0.0, 1.0);
  col = mix(col, irr * 0.4, fa);
  alpha = mix(alpha, 1.0, fa);

  // slip under the banks
  float edge = smoothstep(0.0, 0.13, vWUv.x) * smoothstep(1.0, 0.87, vWUv.x);
  col *= edge;
  alpha *= edge;
  // height fog for a premultiplied surface
  col = mix(col, atmosColor(-V) * alpha, atmosAmount(vWorldPos));
  gl_FragColor = vec4(col, alpha);
}`,
    });
    Sky.registerEnv(mat);
    const mesh = new THREE.Mesh(geo, mat);
    this.waterMesh = mesh;
    mesh.name = 'creek-water';
    mesh.receiveShadow = true;
    mesh.renderOrder = 2;
    return mesh;
  },
};

// Planar mirror for the creek: the scene seen from below the water plane at reduced resolution, rendered
// only while the creek is close and on screen. Small ground scatter and the dense terrain (layer 1) stay
// out of it, a coarse terrain (layer 2) stands in and the grass is thinned; further away, and below the
// high tier, the water falls back to its stand-in reflection.
const CreekMirror = {
  rt: null,
  scale: 0,
  w: 1, h: 1,
  cam: (() => { const c = new THREE.PerspectiveCamera(); c.layers.enable(2); return c; })(),
  uniforms: { uReflTex: { value: null }, uReflMat: { value: new THREE.Matrix4() }, uReflOn: { value: 0 } },
  _p: new THREE.Vector3(),
  _look: new THREE.Vector3(),
  _plane: new THREE.Plane(),
  _clip: new THREE.Vector4(),
  _q: new THREE.Vector4(),
  _bias: new THREE.Matrix4().set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1),

  setQuality(q) {
    this.scale = q.mirror || 0;
    this.allocate();
  },

  setSize(w, h) {
    this.w = w;
    this.h = h;
    this.allocate();
  },

  allocate() {
    const w = Math.max(1, Math.round(this.w * this.scale)), h = Math.max(1, Math.round(this.h * this.scale));
    if (!this.scale) {
      if (this.rt) this.rt.dispose();
      this.rt = null;
      this.uniforms.uReflTex.value = null;
      return;
    }
    if (this.rt && this.rt.width === w && this.rt.height === h) return;
    if (this.rt) this.rt.dispose();
    this.rt = new THREE.WebGLRenderTarget(w, h, {
      type: THREE.HalfFloatType, depthBuffer: true, generateMipmaps: false,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    });
    this.uniforms.uReflTex.value = this.rt.texture;
  },

  update(app) {
    const u = this.uniforms;
    u.uReflOn.value = 0;
    if (!this.rt || !World.waterMesh || !World.waterMesh.visible) return;
    const cam = app.camera;
    cam.updateMatrixWorld();
    // the nearest stretch of creek that is on screen sets the plane and whether the mirror is worth it
    let best = Infinity, planeY = 0;
    const p = this._p;
    for (const s of World.creekSamples) {
      p.set(s[0], s[1], s[2]).project(cam);
      if (p.z < -1 || p.z > 1 || Math.abs(p.x) > 1.1 || Math.abs(p.y) > 1.1) continue;
      const d = Math.hypot(s[0] - cam.position.x, s[1] - cam.position.y, s[2] - cam.position.z);
      if (d < best) { best = d; planeY = s[1]; }
    }
    const on = 1 - smoothstep(20, 28, best);
    if (on <= 0 || cam.position.y < planeY + 0.05) return;

    // mirror the camera through the plane y = planeY
    const vc = this.cam;
    vc.position.set(cam.position.x, 2 * planeY - cam.position.y, cam.position.z);
    cam.getWorldDirection(this._look);
    this._look.y *= -1;
    vc.up.set(0, 1, 0).applyQuaternion(cam.quaternion);
    vc.up.y *= -1;
    vc.lookAt(this._look.add(vc.position));
    vc.near = cam.near;
    vc.far = cam.far;
    vc.updateMatrixWorld();
    vc.projectionMatrix.copy(cam.projectionMatrix);
    u.uReflMat.value.copy(this._bias).multiply(vc.projectionMatrix).multiply(vc.matrixWorldInverse);
    // oblique near plane: nothing below the water surface reaches the mirror
    const plane = this._plane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), p.set(0, planeY, 0)).applyMatrix4(vc.matrixWorldInverse);
    const clip = this._clip.set(plane.normal.x, plane.normal.y, plane.normal.z, plane.constant);
    const e = vc.projectionMatrix.elements, q = this._q;
    q.set((Math.sign(clip.x) + e[8]) / e[0], (Math.sign(clip.y) + e[9]) / e[5], -1, (1 + e[10]) / e[14]);
    clip.multiplyScalar(2 / clip.dot(q));
    e[2] = clip.x; e[6] = clip.y; e[10] = clip.z + 1; e[14] = clip.w;
    vc.projectionMatrixInverse.copy(vc.projectionMatrix).invert();

    const r = app.renderer;
    const grass = app.grass && app.grass.mesh.geometry;
    const grassCount = grass ? grass.instanceCount : 0;
    if (grass) grass.instanceCount = Math.min(grassCount, 12000);
    World.waterMesh.visible = false;
    U.uReflPass.value.set(1, planeY, 0, 0);
    const autoShadow = r.shadowMap.autoUpdate;
    r.shadowMap.autoUpdate = false;
    const prev = r.getRenderTarget();
    r.setRenderTarget(this.rt);
    r.clear();
    r.render(app.scene, vc);
    r.setRenderTarget(prev);
    r.shadowMap.autoUpdate = autoShadow;
    U.uReflPass.value.set(0, 0, 0, 0);
    World.waterMesh.visible = true;
    if (grass) grass.instanceCount = grassCount;
    u.uReflOn.value = on;
  },
};
