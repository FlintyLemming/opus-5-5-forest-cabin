      present: mk('present', {
        tLdr: { value: null }, tFrozen: { value: null }, uLdrTexel: { value: new THREE.Vector2() }, uRes: this.uRes,
        uFxaa: { value: 0 }, uCross: { value: 1 }, uFade: { value: 0 }, uBarPx: { value: 0 }, uGrain: { value: 0.03 }, uFrame: { value: 0 },
        uBarColor: { value: new THREE.Vector3(10 / 255, 12 / 255, 10 / 255) },
      }),
      copy: mk('copy', { tSrc: { value: null } }),
    };
    this.m.bokeh = null;
  }

  makeRT(w, h, opts = {}) {
    return new THREE.WebGLRenderTarget(Math.max(1, w), Math.max(1, h), {
      type: THREE.HalfFloatType, format: THREE.RGBAFormat, depthBuffer: false,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false,
      wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, ...opts,
    });
  }

  setQuality(q) {
    this.q = q;
    const taps = q.dofTaps;
    const maxCoc = 12;
    if (this.m.bokeh) this.m.bokeh.dispose();
    this.m.bokeh = new THREE.ShaderMaterial({
      vertexShader: FULLSCREEN_VS,
      fragmentShader: POST_COMMON + POST_SHADERS.bokeh,
      uniforms: {
        ...this.common, tCoc: { value: null }, tFocus: { value: null }, uTexel: { value: new THREE.Vector2() },
        uFocus: { value: 10 }, uAuto: { value: 0 }, uCocScale: { value: 1 }, uMaxCoc: { value: maxCoc },
      },
      defines: { TAPS: taps, RAD_SCALE: ((maxCoc * maxCoc) / (2 * taps)).toFixed(3) },
      depthTest: false, depthWrite: false,
    });
    this.state.fxaa = q.msaa === 0;
    if (this.w > 1) this.allocate();
  }

  setSize(w, h, outW, outH) {
    this.w = Math.max(2, Math.round(w));
    this.h = Math.max(2, Math.round(h));
    this.outW = outW;
    this.outH = outH;
    this.uRes.value.set(outW, outH);
    this.allocate();
  }

  allocate() {
    const { w, h, q } = this;
    if (!q) return;
    this.dispose();
    const depth = new THREE.DepthTexture(w, h, THREE.UnsignedIntType);
    this.rtScene = new THREE.WebGLRenderTarget(w, h, {
      type: THREE.HalfFloatType, format: THREE.RGBAFormat, samples: q.msaa,
      depthBuffer: true, depthTexture: depth, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false,
    });
    const hw = Math.ceil(w / 2), hh = Math.ceil(h / 2);
    this.rtCoc = this.makeRT(hw, hh);
    this.rtDof = this.makeRT(hw, hh);
    this.rtFocus = [this.makeRT(1, 1, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter }), this.makeRT(1, 1, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter })];
    const rw = Math.max(16, Math.round(w * q.rayScale)), rh = Math.max(16, Math.round(h * q.rayScale));
    this.rtRayA = this.makeRT(rw, rh);
    this.rtRayB = this.makeRT(rw, rh);
    this.bloomDown = [];
    this.bloomUp = [];
    let bw = w, bh = h;
    for (let i = 0; i < q.bloomLevels; i++) {
      bw = Math.max(2, Math.ceil(bw / 2));
      bh = Math.max(2, Math.ceil(bh / 2));
      this.bloomDown.push(this.makeRT(bw, bh));
      this.bloomUp.push(this.makeRT(bw, bh));
    }
    this.rtLdr = this.makeRT(w, h);
    this.rtFrozen = this.makeRT(w, h);
    this.frozenValid = false;
    this.clearFocus = true;
  }

  dispose() {
    const all = [this.rtScene, this.rtCoc, this.rtDof, this.rtRayA, this.rtRayB, this.rtLdr, this.rtFrozen, ...(this.rtFocus || []), ...(this.bloomDown || []), ...(this.bloomUp || [])];
    for (const rt of all) {
      if (!rt) continue;
      if (rt.depthTexture) rt.depthTexture.dispose();
      rt.dispose();
    }
  }

  pass(mat, target) {
    this.quad.material = mat;
    this.renderer.setRenderTarget(target);
    this.renderer.render(this.scene, this.cam);
  }

  // Copy the current graded frame so the next shot can dissolve from it.
  freezeFrame() {
    if (!this.rtLdr) return;
    this.m.copy.uniforms.tSrc.value = this.rtLdr.texture;
    this.pass(this.m.copy, this.rtFrozen);
    this.frozenValid = true;
  }

  render(scene, camera, time, dt) {
    const r = this.renderer;
    const s = this.state;
    const q = this.q;
    this.common.uNear.value = camera.near;
    this.common.uFar.value = camera.far;

    r.setRenderTarget(this.rtScene);
    r.render(scene, camera);
    const depthTex = this.rtScene.depthTexture;

    // depth of field
    const filmH = camera.getFilmHeight() / 1000;
    const f = camera.getFocalLength() / 1000;
    const cocFull = ((f * f) / Math.max(0.7, s.fstop)) * (this.h / filmH) * s.cocBoost;
    const focusTex = this.rtFocus[this.focusIndex].texture;
    if (s.dof) {
      const mc = this.m.coc.uniforms;
      mc.tScene.value = this.rtScene.texture;
      mc.tDepth.value = depthTex;
      mc.uSrcTexel.value.set(1 / this.w, 1 / this.h);
      this.pass(this.m.coc, this.rtCoc);
      if (s.autoFocus) {
        const next = 1 - this.focusIndex;
        const mf = this.m.focus.uniforms;
        mf.tCoc.value = this.rtCoc.texture;
        mf.tPrev.value = this.clearFocus ? null : this.rtFocus[this.focusIndex].texture;
        mf.uBlend.value = 1 - Math.exp(-dt * 3.0);
        if (this.clearFocus) {
          r.setRenderTarget(this.rtFocus[this.focusIndex]);
          r.setClearColor(0x000000, 1);
          r.clear(true, false, false);
          mf.tPrev.value = this.rtFocus[this.focusIndex].texture;
          this.clearFocus = false;
        }
        this.pass(this.m.focus, this.rtFocus[next]);
        this.focusIndex = next;
      }
      const mb = this.m.bokeh.uniforms;
      mb.tCoc.value = this.rtCoc.texture;
      mb.tFocus.value = this.rtFocus[this.focusIndex].texture;
      mb.uTexel.value.set(1 / this.rtCoc.width, 1 / this.rtCoc.height);
      mb.uFocus.value = s.focus;
      mb.uAuto.value = s.autoFocus ? 1 : 0;
      mb.uCocScale.value = cocFull * 0.5;
      this.pass(this.m.bokeh, this.rtDof);
    }

    // god rays from the sun (only when it is near the frame)
    const raysOn = this.rayVis * s.rays > 0.003;
    if (raysOn) {
      const mm = this.m.rayMask.uniforms;
      mm.tScene.value = this.rtScene.texture;
      mm.tDepth.value = depthTex;
      mm.uAspect.value = this.w / this.h;
      this.pass(this.m.rayMask, this.rtRayA);
      const mbl = this.m.rayBlur.uniforms;
      let src = this.rtRayA, dst = this.rtRayB;
      for (const step of [0.62, 0.2, 0.06]) {
        mbl.tSrc.value = src.texture;
        mbl.uStep.value = step;
        this.pass(this.m.rayBlur, dst);
        [src, dst] = [dst, src];
      }
      this.rayResult = src;
    }

    // bloom
    const md = this.m.down.uniforms;
    let src = this.rtScene;
    for (let i = 0; i < this.bloomDown.length; i++) {
      md.tSrc.value = src.texture;
      md.uTexel.value.set(1 / src.width, 1 / src.height);
      md.uKaris.value = i === 0 ? 1 : 0;
      this.pass(this.m.down, this.bloomDown[i]);
      src = this.bloomDown[i];
    }
    const mu = this.m.up.uniforms;
    let low = this.bloomDown[this.bloomDown.length - 1];
    for (let i = this.bloomDown.length - 2; i >= 0; i--) {
      mu.tSrc.value = this.bloomDown[i].texture;
      mu.tLow.value = low.texture;
      mu.uTexel.value.set(1 / low.width, 1 / low.height);
      mu.uScatter.value = 0.68;
      this.pass(this.m.up, this.bloomUp[i]);
      low = this.bloomUp[i];
    }

    // grade
    const mc = this.m.composite.uniforms;
    mc.tScene.value = this.rtScene.texture;
    mc.tDepth.value = depthTex;
    mc.tDof.value = this.rtDof.texture;
    mc.tFocus.value = this.rtFocus[this.focusIndex].texture;
    mc.tBloom.value = low.texture;
    mc.tRays.value = raysOn ? this.rayResult.texture : this.rtRayB.texture;
    mc.uDof.value = s.dof ? 1 : 0;
    mc.uFocus.value = s.focus;
    mc.uAuto.value = s.autoFocus ? 1 : 0;
    mc.uCocScale.value = cocFull;
    mc.uBloom.value = s.bloom;
    const rk = raysOn ? this.rayVis * s.rays : 0;
    mc.uRaysCol.value.set(U.uSunCol.value.r * rk, U.uSunCol.value.g * rk, U.uSunCol.value.b * rk);
    mc.uExposure.value = s.exposure;
    const wb = [1 + s.temp * 0.9, 1 + s.tint * 0.5, 1 - s.temp * 1.1];
    const wl = 0.2126 * wb[0] + 0.7152 * wb[1] + 0.0722 * wb[2];
    mc.uWB.value.set(wb[0] / wl, wb[1] / wl, wb[2] / wl);
    mc.uContrast.value = s.contrast;
    mc.uSat.value = s.sat;
    mc.uSplit.value = s.split;
    mc.uLift.value = s.lift;
    mc.uShadowTint.value.copy(s.shadowTint);
    mc.uHighTint.value.copy(s.highTint);
    mc.uVignette.value = s.vignette;
    mc.uCA.value = s.ca;
    this.pass(this.m.composite, this.rtLdr);

    // present
    const mp = this.m.present.uniforms;
    mp.tLdr.value = this.rtLdr.texture;
    mp.tFrozen.value = this.frozenValid ? this.rtFrozen.texture : this.rtLdr.texture;
    mp.uLdrTexel.value.set(1 / this.w, 1 / this.h);
    mp.uFxaa.value = s.fxaa ? 1 : 0;
    mp.uCross.value = this.frozenValid ? s.cross : 1;
    mp.uFade.value = s.fade;
    mp.uBarPx.value = s.bars * this.outH;
    mp.uGrain.value = s.grain;
    mp.uFrame.value = Math.floor(time * 24) % 997;
    this.pass(this.m.present, null);
  }

  // Sun position on screen and how much god rays should show.
  updateSun(camera, sunDir, keyEl) {
    const p = new THREE.Vector3().copy(camera.position).addScaledVector(sunDir, 500);
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    const facing = fwd.dot(sunDir);
    p.project(camera);
    this.sunScreen.set(p.x * 0.5 + 0.5, p.y * 0.5 + 0.5);
    const out = Math.max(Math.abs(p.x), Math.abs(p.y));
    this.rayVis = smoothstep(0.05, 0.35, facing) * (1 - smoothstep(1.0, 1.8, out)) * smoothstep(-3, 2, keyEl);
  }
}

   that takes over from the current shot, and the hand-off between the two. */

// hfov is the horizontal field of view in degrees; fstop and focus drive depth of field.

// Trees are kept off the low camera paths and out of each shot's line of sight.
const SHOT_CLEARANCE = (() => {
  const out = [];
  for (const s of SHOTS) {
    let pos = s.pos, look = s.look;
    if (s.orbit) {
      const o = s.orbit;
      pos = [];
      for (let i = 0; i <= 8; i++) {
        const a = lerp(o.a0, o.a1, i / 8) * DEG;
        pos.push([o.look[0] + Math.sin(a) * o.r, o.h, o.look[2] + Math.cos(a) * o.r]);
      }
      look = pos.map(() => o.look);
    }
    for (let i = 0; i < pos.length - 1; i++) {
      const [x0, h0, z0] = pos[i], [x1, h1, z1] = pos[i + 1];
      for (let k = 0; k <= 6; k++) {
        const t = k / 6, h = lerp(h0, h1, t);
        if (h > 24) continue;
        out.push([lerp(x0, x1, t), lerp(z0, z1, t), h > 10 ? 5.5 : 4.4]);
      }
    }
    // line of sight from the last third of the path toward the subject
    if (look && !s.noSight) {
      for (const i of [Math.max(0, pos.length - 2), pos.length - 1]) {
        const p = pos[i], l = look[Math.min(i, look.length - 1)];
        const d = Math.hypot(l[0] - p[0], l[2] - p[2]);
        for (let t = 0.1; t < 0.85; t += 2.5 / Math.max(d, 1)) out.push([lerp(p[0], l[0], t), lerp(p[2], l[2], t), 3.2]);
      }
    }
  }
  return out;
})();

class Director {
  constructor(app) {
    this.app = app;
    this.index = 0;
    this.t = 0;
    this.curves = SHOTS.map((s) => this.buildCurves(s));
    this.started = false;
    this.speed = app.reducedMotion ? 0.7 : 1;
    this.titleShown = false;
  }
  groundY(x, z, shot) {
    if (shot && shot.water) {
      const d = World.creekDist(x, z);
      const g = World.heightAt(x, z);
      if (d < 4) return Math.max(g, World.waterAt(World.creekField.param(x, z)));
      return g;
    }
    return World.heightAt(x, z);
  }
  buildCurves(s) {
    let pos, look;
    if (s.orbit) {
      const o = s.orbit, c = WORLD.clearing;
      pos = [];
      for (let i = 0; i <= 4; i++) {
        const a = lerp(o.a0, o.a1, i / 4) * DEG;
        const x = o.look[0] + Math.sin(a) * o.r, z = o.look[2] + Math.cos(a) * o.r;
        pos.push(new THREE.Vector3(x, this.groundY(x, z) + o.h + Math.sin((i / 4) * Math.PI) * 1.5, z));
      }
      const ly = World.heightAt(o.look[0], o.look[2]) + o.look[1];
      look = [new THREE.Vector3(o.look[0], ly, o.look[2]), new THREE.Vector3(o.look[0] - 1, ly, o.look[2] + 0.5)];
      void c;
    } else {
      const base = (p, isLook) => {
        if (s.porch || (isLook && s.focusFromFloor)) return new THREE.Vector3(p[0], (s.porch ? CABIN.PFL : World.heightAt(p[0], p[2])) + p[1], p[2]);
        return new THREE.Vector3(p[0], this.groundY(p[0], p[2], s) + p[1], p[2]);
      };
      pos = s.pos.map((p) => base(p, false));
      look = s.look.map((p) => base(p, true));
    }
    const focusPt = Array.isArray(s.focus) ? new THREE.Vector3(s.focus[0], (s.focusFromFloor ? CABIN.FL : World.heightAt(s.focus[0], s.focus[2])) + s.focus[1], s.focus[2]) : null;
    return {
      pos: new THREE.CatmullRomCurve3(pos, false, 'centripetal'),
      look: new THREE.CatmullRomCurve3(look, false, 'centripetal'),
      focusPt,
    };
  }
  start(index = 0, t = 0) {
    this.index = ((index % SHOTS.length) + SHOTS.length) % SHOTS.length;
    this.t = t;
    this.started = true;
    const s = SHOTS[this.index];
    UI.setSlate(`${String(this.index + 1).padStart(2, '0')} / ${String(SHOTS.length).padStart(2, '0')}　${s.name}`);
  }
  next() {
    this.app.post.freezeFrame();
    this.app.crossfade(1.6);
    this.start(this.index + 1);
  }
  update(dt) {
    if (!this.started) this.start(0);
    const s = SHOTS[this.index];
    this.t += dt * this.speed;
    if (s.title) {
      const show = this.t > 2.2 && this.t < 10.5;
      if (show !== this.titleShown) { UI.showTitle(show); this.titleShown = show; }
    } else if (this.titleShown) {
      UI.showTitle(false);
      this.titleShown = false;
    }
    if (this.t >= s.dur) this.next();
  }
  apply(camera, time) {
    const s = SHOTS[this.index], c = this.curves[this.index];
    const u = clamp(this.t / s.dur, 0, 1);
    const e = easeInOutSine(u) * 0.85 + u * 0.15;
    const p = c.pos.getPoint(e), l = c.look.getPoint(e);
    if (!this.app.reducedMotion) {
      const k = 0.012;
      p.x += Noise.n2(time * 0.21, 1.1) * k * 1.4;
      p.y += Noise.n2(time * 0.17, 5.3) * k;
      p.z += Noise.n2(time * 0.19, 9.7) * k;
      l.x += Noise.n2(time * 0.13, 3.3) * k * 2.5;
      l.y += Noise.n2(time * 0.15, 7.7) * k * 2.5;
    }
    camera.position.copy(p);
    camera.up.set(0, 1, 0);
    camera.lookAt(l);
    const hfov = lerp(s.hfov[0], s.hfov[1], e);
    this.app.setHFov(hfov);
    const ps = this.app.post.state;
    ps.fstop = s.fstop;
    ps.autoFocus = false;
    if (c.focusPt) ps.focus = Math.max(0.5, p.distanceTo(c.focusPt));
    else if (typeof s.focus === 'number') ps.focus = s.focus;
    else ps.focus = Math.max(0.5, p.distanceTo(l));
    const night = smoothstep(1.3, 2, this.app.tod.value);
    this.app.shotExposure = Math.pow(2, (s.ev || 0) + (s.evNight || 0) * night);
  }
}

class OrbitRig {
  constructor(app) {
    this.app = app;
    this.target = new THREE.Vector3();
    this.radius = 18;
    this.theta = 0.6;
    this.phi = 1.25;
    this.vTheta = 0;
    this.vPhi = 0;
    this.vRadius = 0;
    this.panV = new THREE.Vector3();
    this.hfov = 58;
  }
  fromCamera(camera, lookDist) {
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    const c = WORLD.clearing;
    const t = camera.position.clone().addScaledVector(fwd, clamp(lookDist || 14, 4, 30));
    const dx = t.x - c.cx, dz = t.z - c.cz, d = Math.hypot(dx, dz);
    if (d > 16) { t.x = c.cx + (dx / d) * 16; t.z = c.cz + (dz / d) * 16; }
    t.y = Math.max(World.heightAt(t.x, t.z) + 0.8, Math.min(t.y, World.heightAt(t.x, t.z) + 6));
    this.target.copy(t);
    const off = camera.position.clone().sub(t);
    this.radius = clamp(off.length(), 3.5, 42);
    this.theta = Math.atan2(off.x, off.z);
    this.phi = clamp(Math.acos(clamp(off.y / Math.max(off.length(), 1e-3), -1, 1)), 0.35, 1.52);
    this.vTheta = this.vPhi = this.vRadius = 0;
    this.panV.set(0, 0, 0);
    this.hfov = this.app.currentHFov || 58;
  }
  rotate(dx, dy) {
    this.vTheta -= dx * 0.0052;
    this.vPhi -= dy * 0.0045;
  }
  zoom(f) { this.vRadius += Math.log(f) * 1.6; }
  pan(dx, dy) {
    const cam = this.app.camera;
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0).setY(0).normalize();
    const fwd = new THREE.Vector3(-right.z, 0, right.x);
    const k = this.radius * 0.0016;
    this.panV.addScaledVector(right, -dx * k).addScaledVector(fwd, dy * k);
  }
  update(dt) {
    const decay = Math.exp(-dt * 7.5);
    this.theta += this.vTheta * dt * 9;
    this.phi += this.vPhi * dt * 9;
    this.radius *= Math.exp(this.vRadius * dt * 9);
    this.target.addScaledVector(this.panV, dt * 9);
    this.vTheta *= decay;
    this.vPhi *= decay;
    this.vRadius *= decay;
    this.panV.multiplyScalar(decay);
    this.phi = clamp(this.phi, 0.35, 1.52);
    this.radius = clamp(this.radius, 3.5, 42);
    const c = WORLD.clearing;
    const dx = this.target.x - c.cx, dz = this.target.z - c.cz, d = Math.hypot(dx, dz);
    if (d > 16) { this.target.x = c.cx + (dx / d) * 16; this.target.z = c.cz + (dz / d) * 16; }
    const g = World.heightAt(this.target.x, this.target.z);
    this.target.y = clamp(this.target.y, g + 0.8, g + 6);
  }
  apply(camera) {
    const sp = Math.sin(this.phi);
    const p = new THREE.Vector3(Math.sin(this.theta) * sp, Math.cos(this.phi), Math.cos(this.theta) * sp).multiplyScalar(this.radius).add(this.target);
    // keep out of the ground and the cabin
    const g = World.heightAt(p.x, p.z);
    if (p.y < g + 0.45) p.y = g + 0.45;
    const inCabin = p.x > -4.1 && p.x < 4.8 && p.z > -3.3 && p.z < 5.3 && p.y < CABIN.FL + 5.3;
    if (inCabin) p.y = CABIN.FL + 5.3;
    camera.position.copy(p);
    camera.up.set(0, 1, 0);
    camera.lookAt(this.target);
    this.app.setHFov(this.hfov);
    const ps = this.app.post.state;
    ps.autoFocus = true;
    ps.fstop = 5.6;
    ps.focus = this.radius;
    this.app.shotExposure = 1;
  }
}

// Pointer and wheel input: dragging in film mode hands the camera to the orbit rig.
function attachControls(app) {
  const el = document.getElementById('stage');
  const pointers = new Map();
  let last = null, pinch = null, moved = 0;
  const now = () => performance.now();
  el.addEventListener('pointerdown', (e) => {
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, button: e.button, shift: e.shiftKey });
    last = { x: e.clientX, y: e.clientY };
    moved = 0;
    app.dragFlag = false;
    app.lastInput = now();
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
    }
  });
  el.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX;
    p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 6) {
      app.dragFlag = true;
      el.classList.add('dragging');
      if (app.mode !== 'free') app.setMode('free', { user: true });
    }
    app.lastInput = now();
    if (app.mode !== 'free') return;
    if (pointers.size === 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      if (d > 0 && pinch.d > 0) app.orbit.zoom(pinch.d / d);
      app.orbit.pan(cx - pinch.cx, cy - pinch.cy);
      pinch = { d, cx, cy };
    } else if (p.button === 2 || p.shift) {
      app.orbit.pan(dx, dy);
    } else {
      app.orbit.rotate(dx, dy);
    }
  });
  const end = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (!pointers.size) el.classList.remove('dragging');
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    app.lastInput = now();
    if (app.mode !== 'free') app.setMode('free', { user: true });
    app.orbit.zoom(Math.exp(e.deltaY * 0.0012));
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (app.mode !== 'free' || (e.target && /INPUT|SELECT/.test(e.target.tagName))) return;
    const k = { ArrowLeft: [-30, 0], ArrowRight: [30, 0], ArrowUp: [0, -20], ArrowDown: [0, 20] }[e.key];
    if (k) { app.orbit.rotate(k[0], k[1]); app.lastInput = now(); e.preventDefault(); }
  });
}

// ── 12-audio.js ─────────────────────────────────────────────────
/* Ambience: procedural WebAudio soundscape. Wind follows the same gust signal that moves the grass,
   the creek and the fire get louder as the camera approaches, birds sing at dawn and dusk, and
   crickets and an owl take over at night. Starts only from the sound button. */

const Ambience = {
  ctx: null,
  master: null,
  enabled: false,
  buses: {},
  timers: { bird: 2, cricket: 0.5, owl: 12, crackle: 0 },
  levels: { birds: 0, crickets: 0, owl: 0, fire: 0 },

  setEnabled(on, app) {
    this.enabled = on;
    if (on) {
      if (!this.ctx) this.build();
      if (!this.ctx) return;
      this.ctx.resume().catch(() => {});
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setTargetAtTime(0.85, t, 0.6);
    } else if (this.ctx) {
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setTargetAtTime(0, t, 0.2);
      setTimeout(() => { if (!this.enabled && this.ctx) this.ctx.suspend().catch(() => {}); }, 900);
    }
    void app;
  },

  noiseBuffer(seconds, color) {
    const ctx = this.ctx;
    const n = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let b0 = 0, b1 = 0, b2 = 0, last = 0;
      for (let i = 0; i < n; i++) {
        const w = Math.random() * 2 - 1;
        if (color === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
        else if (color === 'pink') {
          b0 = 0.99765 * b0 + w * 0.099046; b1 = 0.963 * b1 + w * 0.2965164; b2 = 0.57 * b2 + w * 1.0526913;
          d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.16;
        } else d[i] = w;
      }
    }
    return buf;
  },

  loop(buf) {
    const s = this.ctx.createBufferSource();
    s.buffer = buf;
    s.loop = true;
    s.start(0, Math.random() * buf.duration);
    return s;
  },

  build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    let ctx;
    try { ctx = new AC(); } catch { return; }
    this.ctx = ctx;
    this.master = ctx.createGain();
    this.master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.ratio.value = 3;
    this.master.connect(comp).connect(ctx.destination);
    const bus = (name, gain = 0) => {
      const g = ctx.createGain();
      g.gain.value = gain;
      g.connect(this.master);
      this.buses[name] = g;
      return g;
    };
    const brown = this.noiseBuffer(6, 'brown');
    const pink = this.noiseBuffer(6, 'pink');
    this.white = this.noiseBuffer(0.05, 'white');

    // wind: low roar whose brightness follows the gusts
    const wind = bus('wind');
    const windLp = ctx.createBiquadFilter();
    windLp.type = 'lowpass';
    windLp.frequency.value = 420;
    windLp.Q.value = 0.6;
    this.loop(brown).connect(windLp).connect(wind);
    this.windLp = windLp;

    // leaves rustling in the canopy
    const rustle = bus('rustle');
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1800;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 4200;
    bp.Q.value = 0.5;
    this.loop(pink).connect(hp).connect(bp).connect(rustle);
    const flutter = ctx.createOscillator();
    const flutterGain = ctx.createGain();
    flutter.frequency.value = 0.7;
    flutterGain.gain.value = 0.35;
    flutter.connect(flutterGain).connect(rustle.gain);
    flutter.start();

    // creek: two bands of babbling water
    const creek = bus('creek');
    for (const [f, q, k] of [[700, 0.8, 1], [2300, 1.2, 0.55]]) {
      const f1 = ctx.createBiquadFilter();
      f1.type = 'bandpass';
      f1.frequency.value = f;
      f1.Q.value = q;
      const g = ctx.createGain();
      g.gain.value = k;
      this.loop(pink).connect(f1).connect(g).connect(creek);
      const lfo = ctx.createOscillator();
      const lg = ctx.createGain();
      lfo.frequency.value = 0.3 + Math.random() * 0.4;
      lg.gain.value = f * 0.25;
      lfo.connect(lg).connect(f1.frequency);
      lfo.start();
    }

    // fire: low rumble plus scheduled crackles
    const fire = bus('fire');
    const flp = ctx.createBiquadFilter();
    flp.type = 'lowpass';
    flp.frequency.value = 260;
    const fg = ctx.createGain();
    fg.gain.value = 0.6;
    this.loop(brown).connect(flp).connect(fg).connect(fire);
    this.crackleBp = ctx.createBiquadFilter();
    this.crackleBp.type = 'bandpass';
    this.crackleBp.frequency.value = 3000;
    this.crackleBp.Q.value = 0.7;
    this.crackleBp.connect(fire);

    bus('birds', 1);
    bus('crickets', 1);
    // owl through a soft echo
    const owl = bus('owl', 1);
    this.owlIn = ctx.createGain();
    const delay = ctx.createDelay(1.5);
    delay.delayTime.value = 0.32;
    const fb = ctx.createGain();
    fb.gain.value = 0.28;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1400;
    this.owlIn.connect(owl);
    this.owlIn.connect(delay).connect(lp).connect(fb).connect(delay);
    lp.connect(owl);
  },

  panner(x) {
    if (this.ctx.createStereoPanner) {
      const p = this.ctx.createStereoPanner();
      p.pan.value = clamp(x, -1, 1);
      return p;
    }
    return this.ctx.createGain();
  },

  chirp(level) {
    const ctx = this.ctx, t0 = ctx.currentTime + 0.05;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const pan = this.panner(Math.random() * 1.6 - 0.8);
    o.type = 'sine';
    g.gain.value = 0;
    const base = 2600 + Math.random() * 2200;
    const notes = 2 + Math.floor(Math.random() * 5);
    const vol = (0.02 + Math.random() * 0.03) * level;
    let t = t0;
    for (let i = 0; i < notes; i++) {
      const d = 0.05 + Math.random() * 0.09;
      const f0 = base * (0.85 + Math.random() * 0.35), f1 = f0 * (Math.random() < 0.5 ? 0.62 : 1.35);
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      t += d + 0.03 + Math.random() * 0.07;
    }
    o.connect(g).connect(pan).connect(this.buses.birds);
    o.start(t0);
    o.stop(t + 0.1);
  },

  cricket(level) {
    const ctx = this.ctx, t0 = ctx.currentTime + 0.05;
    const o = ctx.createOscillator();
    const am = ctx.createOscillator();
    const amg = ctx.createGain();
    const g = ctx.createGain();
    const pan = this.panner(Math.random() * 1.8 - 0.9);
    o.frequency.value = 4200 + Math.random() * 900;
    am.frequency.value = 26 + Math.random() * 10;
    amg.gain.value = 0.5;
    g.gain.value = 0;
    am.connect(amg).connect(g.gain);
    const vol = (0.006 + Math.random() * 0.01) * level;
    const pulses = 2 + Math.floor(Math.random() * 3);
    let t = t0;
    for (let i = 0; i < pulses; i++) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.02);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.13);
      t += 0.2;
    }
    o.connect(g).connect(pan).connect(this.buses.crickets);
    o.start(t0); am.start(t0);
    o.stop(t + 0.1); am.stop(t + 0.1);
  },

  hoot(level) {
    const ctx = this.ctx, t0 = ctx.currentTime + 0.05;
    const pattern = [[0, 0.22, 1], [0.4, 0.18, 0.8], [0.75, 0.6, 1]];
    for (const [dt, dur, k] of pattern) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(390, t0 + dt);
      o.frequency.linearRampToValueAtTime(350, t0 + dt + dur);
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.linearRampToValueAtTime(0.05 * level * k, t0 + dt + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + dur);
      o.connect(g).connect(this.owlIn);
      o.start(t0 + dt);
      o.stop(t0 + dt + dur + 0.05);
    }
  },

  crackle(level) {
    const ctx = this.ctx;
    const s = ctx.createBufferSource();
    s.buffer = this.white;
    s.playbackRate.value = 0.5 + Math.random() * 1.5;
    const g = ctx.createGain();
    g.gain.value = (0.08 + Math.random() * 0.25) * level;
    s.connect(g).connect(this.crackleBp);
    s.start(ctx.currentTime + Math.random() * 0.05, 0, 0.004 + Math.random() * 0.012);
  },

  update(app, dt) {
    if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
    const p = app.params, t = this.ctx.currentTime, cam = app.camera.position;
    const set = (bus, v) => this.buses[bus].gain.setTargetAtTime(v, t, 0.4);
    const gust = app.gust;
    set('wind', (0.05 + 0.13 * gust) * (p.wind ?? 0.8));
    this.windLp.frequency.setTargetAtTime(260 + 520 * gust, t, 0.5);
    set('rustle', (0.012 + 0.05 * gust * gust) * (p.wind ?? 0.8));
    const dc = World.creekDist(cam.x, cam.z);
    set('creek', 0.22 * (1 - smoothstep(3, 38, dc)) + 0.015);
    const fire = app.yard.emitters.fire;
    const df = Math.hypot(cam.x - fire.x, cam.z - fire.z);
    const fireLevel = (p.fire || 0) * (1 - smoothstep(2, 24, df));
    set('fire', 0.35 * fireLevel);
    this.timers.bird -= dt;
    if (this.timers.bird <= 0) {
      if (p.birds > 0.08) this.chirp(p.birds);
      this.timers.bird = (1.2 + Math.random() * 4) / Math.max(0.25, p.birds);
    }
    this.timers.cricket -= dt;
    if (this.timers.cricket <= 0) {
      if (p.crickets > 0.08) this.cricket(p.crickets);
      this.timers.cricket = (0.15 + Math.random() * 0.6) / Math.max(0.3, p.crickets);
    }
    this.timers.owl -= dt;
    if (this.timers.owl <= 0) {
      if (p.owl > 0.2) this.hoot(p.owl);
      this.timers.owl = 14 + Math.random() * 22;
    }
    this.timers.crackle -= dt;
    while (this.timers.crackle <= 0) {
      if (fireLevel > 0.05) this.crackle(fireLevel);
      this.timers.crackle += 0.04 + Math.random() * 0.25;
    }
  },
};

// ── 12-ui.js ────────────────────────────────────────────────────
/* UI: loader, title card, slate, control bar, hints, idle hiding and the error panel. */

// Self-contained so it works even if the rest of the module never finished initializing.
function showFatal(message, err) {
  if (err) console.error(err);
  const panel = document.getElementById('error');
  const text = document.getElementById('error-text');
  if (!panel || !text) return;
  text.textContent = message;
  panel.hidden = false;
  const loader = document.getElementById('loader');
  if (loader) loader.classList.add('done');
  const reload = document.getElementById('error-reload');
  if (reload) reload.onclick = () => location.reload();
}

const TIME_NAMES = [
  [0.0, '清晨'], [0.5, '白昼'], [1.0, '黄昏'], [1.5, '蓝调时分'], [2.0, '月夜'],
];
function timeName(t) {
  let best = TIME_NAMES[0];
  for (const n of TIME_NAMES) if (Math.abs(n[0] - t) < Math.abs(best[0] - t)) best = n;
  return best[1];
}

const UI = {
  app: null,
  idleTimer: 0,
  hintTimer: 0,
  lastPointer: 0,
  els: {},

  init(app) {
    this.app = app;
    const $ = (id) => document.getElementById(id);
    this.els = {
      body: document.body,
      stage: $('stage'),
      loaderFill: $('loader-fill'),
      loaderText: $('loader-text'),
      loader: $('loader'),
      title: $('titlecard'),
      titleTime: $('title-time'),
      slate: $('slate'),
      hint: $('hint'),
      hud: $('hud'),
      bar: $('bar'),
      modeCine: $('mode-cine'),
      modeFree: $('mode-free'),
      time: $('time'),
      ticks: [...document.querySelectorAll('.ticks button')],
      sound: $('sound'),
      quality: $('quality'),
      hideUi: $('hide-ui'),
      fullscreen: $('fullscreen'),
    };
    const e = this.els;
    e.modeCine.addEventListener('click', () => app.setMode('cine', { user: true }));
    e.modeFree.addEventListener('click', () => app.setMode('free', { user: true }));
    e.time.addEventListener('input', () => app.setTimeTarget(parseFloat(e.time.value), false));
    for (const b of e.ticks) b.addEventListener('click', () => app.setTimeTarget(parseFloat(b.dataset.time), true));
    e.sound.addEventListener('click', () => app.toggleSound());
    e.quality.addEventListener('change', () => app.setQuality(e.quality.value, true));
    e.hideUi.addEventListener('click', (ev) => { ev.stopPropagation(); this.setHidden(true); });
    e.fullscreen.addEventListener('click', () => this.toggleFullscreen());
    if (!document.fullscreenEnabled) e.fullscreen.hidden = true;

    const wake = () => this.poke();
    window.addEventListener('pointermove', wake, { passive: true });
    window.addEventListener('pointerdown', wake, { passive: true });
    window.addEventListener('keydown', (ev) => this.onKey(ev));
    e.bar.addEventListener('focusin', wake);
    e.stage.addEventListener('click', () => {
      if (document.body.classList.contains('hide-ui') && !app.wasDrag()) this.setHidden(false);
    });
    this.poke();
  },

  onKey(ev) {
    if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') && !['h', 'H', 'f', 'F'].includes(ev.key)) return;
    if (ev.key === 'h' || ev.key === 'H') this.setHidden(!document.body.classList.contains('hide-ui'));
    else if (ev.key === 'f' || ev.key === 'F') this.toggleFullscreen();
    else if (ev.key === '1') this.app.setTimeTarget(0, true);
    else if (ev.key === '2') this.app.setTimeTarget(1, true);
    else if (ev.key === '3') this.app.setTimeTarget(2, true);
    else return;
    this.poke();
  },

  poke() {
    document.body.classList.remove('idle');
    clearTimeout(this.idleTimer);
    this.idleTimer = setTimeout(() => {
      const bar = this.els.bar;
      if (bar.matches(':hover') || bar.contains(document.activeElement)) return this.poke();
      document.body.classList.add('idle');
    }, 3200);
  },

  setHidden(hidden) {
    document.body.classList.toggle('hide-ui', hidden);
    if (!hidden) this.poke();
  },

  async toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch { /* fullscreen is optional; some views refuse it */ }
  },

  progress(frac, text) {
    this.els.loaderFill.style.transform = `scaleX(${clamp(frac, 0, 1).toFixed(3)})`;
    if (text) this.els.loaderText.textContent = text;
  },

  done() {
    this.els.loader.classList.add('done');
    this.els.loader.setAttribute('aria-busy', 'false');
  },

  setMode(mode) {
    this.els.modeCine.setAttribute('aria-pressed', String(mode === 'cine'));
    this.els.modeFree.setAttribute('aria-pressed', String(mode === 'free'));
    this.els.slate.hidden = mode !== 'cine';
  },

  setTimeValue(t) {
    const e = this.els;
    if (document.activeElement !== e.time) e.time.value = t.toFixed(3);
    const name = timeName(t);
    e.time.setAttribute('aria-valuetext', name);
    e.titleTime.textContent = name;
    for (const b of e.ticks) b.classList.toggle('near', Math.abs(parseFloat(b.dataset.time) - t) < 0.25);
  },

  setQuality(key) {
    this.els.quality.value = key;
  },

  setSound(on) {
    this.els.sound.setAttribute('aria-pressed', String(on));
  },

  showTitle(show) {
    this.els.title.classList.toggle('show', !!show);
  },

  setSlate(text) {
    this.els.slate.textContent = text;
  },

  hint(text, ms = 5000) {
    const h = this.els.hint;
    h.textContent = text;
    h.hidden = false;
    h.style.opacity = '1';
    clearTimeout(this.hintTimer);
    this.hintTimer = setTimeout(() => {
      h.style.opacity = '0';
      this.hintTimer = setTimeout(() => { h.hidden = true; }, 900);
    }, ms);
  },
};

// ── 13-main.js ──────────────────────────────────────────────────
/* Main: builds the scene in stages behind the loader, owns time of day, quality, resolution and the frame loop. */

const App = {
  renderer: null,
  scene: null,
  camera: null,
  post: null,
  T: null,
  lights: {},
  qualityKey: 'high',
  quality: QUALITY_TIERS.high,
  renderScale: 1,
  scaleCeil: 1,
  clock: { time: 0, frozen: null, paused: false, last: 0 },
  tod: { value: 1, from: 1, to: 1, anim: 1, dur: 4, dirty: true },
  params: {},
  envTimer: 0,
  systems: [],
  mode: 'cine',
  gust: 0.5,
  perf: { acc: 0, frames: 0, slow: 0, fast: 0, cooldown: 0 },
  dragFlag: false,
  manualCamera: null,
  reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
  shotExposure: 1,
  currentHFov: 58,
  lastInput: 0,
  cross: null,
  fadeIn: null,
  sound: false,

  async init() {
    const canvas = document.getElementById('stage');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, stencil: false, powerPreference: 'high-performance' });
    } catch (err) {
      showFatal('这个浏览器没有可用的 WebGL2，无法显示三维场景。请换用新版的 Chrome、Edge、Safari 或 Firefox 再打开。', err);
      return;
    }
    if (!renderer.capabilities.isWebGL2) {
      showFatal('这个浏览器没有可用的 WebGL2，无法显示三维场景。请换用新版的 Chrome、Edge、Safari 或 Firefox 再打开。');
      return;
    }
    this.renderer = renderer;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    renderer.info.autoReset = false;
    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      showFatal('显卡上下文丢失了（可能是设备休眠或显卡驱动重置）。重新加载页面即可恢复。');
    });

    this.qualityKey = detectQuality(renderer);
    this.quality = QUALITY_TIERS[this.qualityKey];
    UI.init(this);
    UI.setQuality(this.qualityKey);

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1500);
    this.camera.layers.enable(1);
    this.post = new PostFX(renderer);
    this.post.setQuality(this.quality);
    CreekMirror.setQuality(this.quality);
    this.post.state.fade = 1;

    const stages = this.stages();
    for (let i = 0; i < stages.length; i++) {
      UI.progress(i / stages.length, stages[i][0]);
      await nextFrame();
      await stages[i][1]();
    }
    UI.progress(1, '即将开始');
    this.director = new Director(this);
    this.orbit = new OrbitRig(this);
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.applyQuality();
    this.updateTimeOfDay(0, true);
    Sky.updateEnv(renderer, true);
    this.placeCamera(0, 0);
    this.fx.prewarm(this.camera);
    try {
      await renderer.compileAsync(this.scene, this.camera);
    } catch { /* compileAsync is an optimization only */ }
    this.frame(1 / 60);
    this.frame(1 / 60);
    await nextFrame();

    attachControls(this);
    UI.done();
    this.fadeIn = { t: 0, dur: 2.6 };
    window.__cabin.ready = true;
    this.clock.last = performance.now();
    renderer.setAnimationLoop((now) => this.tick(now));
  },

  stages() {
    const r = this.renderer, s = this.scene;
    return [
      ['铺展地形', () => {
        this.T = buildTextures(r);
        World.build();
        s.add(World.buildTerrain(this.T));
        s.add(World.buildWater(this.T));
      }],
      ['天空与远山', () => {
        s.add(Sky.build(r));
        s.add(Sky.buildRidges());
        s.add(Sky.buildCanopy(this.T));
      }],
      ['搭建木屋', () => {
        this.M = cabinMaterials(this.T);
        this.cabin = buildCabin(this.T, this.M);
        s.add(this.cabin.group);
      }],
      ['布置院落', () => {
        yardMaterials(this.T, this.M);
        this.yard = buildYard(this.T, this.M, this.cabin);
        s.add(this.yard.group);
      }],
      ['种下松杉与白桦', () => {
        forestMaterials(this.T, this.M);
        this.forest = buildForest(this.T, this.M, typeof SHOT_CLEARANCE !== 'undefined' ? SHOT_CLEARANCE : []);
        s.add(this.forest.group);
        this.systems.push(this.forest);
      }],
      ['生长草地', () => {
        this.grass = buildGrass(this.cabin, this.yard, this.forest);
        s.add(this.grass.mesh);
        this.systems.push(this.grass);
        this.ground = buildGroundCover(this.T, this.M, this.cabin, this.yard, this.forest);
        s.add(this.ground.group);
        World.commitMask();
      }],
      ['点亮窗灯', () => {
        this.buildLights();
        this.fx = buildFX(this.T, this.M, this.cabin, this.yard, this.forest);
        s.add(this.fx.group);
        this.systems.push(this.fx);
      }],
    ];
  },

  buildLights() {
    const key = new THREE.DirectionalLight(0xffffff, 3);
    key.castShadow = true;
    key.shadow.bias = -0.0003;
    key.shadow.normalBias = 0.035;
    this.scene.add(key, key.target);
    const fill = new THREE.DirectionalLight(0xffffff, 0.2);
    this.scene.add(fill, fill.target);
    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
    this.scene.add(hemi);
    this.lights = { key, fill, hemi };
  },

  fitShadow() {
    const key = this.lights.key;
    const dir = U.uScatterDir.value;
    const c = WORLD.clearing;
    const target = new THREE.Vector3(c.cx, World.cabinY, c.cz - 2);
    key.target.position.copy(target);
    key.position.copy(target).addScaledVector(dir, 260);
    key.target.updateMatrixWorld();
    key.updateMatrixWorld();
    key.shadow.updateMatrices(key);
    const cam = key.shadow.camera;
    cam.updateMatrixWorld();
    const inv = cam.matrixWorldInverse;
    const min = new THREE.Vector3(Infinity, Infinity, Infinity), max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
    const v = new THREE.Vector3();
    const ext = 40;
    for (const x of [c.cx - ext, c.cx + ext]) for (const y of [World.cabinY - 6, World.cabinY + 30]) for (const z of [c.cz - ext - 4, c.cz + ext]) {
      v.set(x, y, z).applyMatrix4(inv);
      min.min(v);
      max.max(v);
    }
    cam.left = min.x; cam.right = max.x; cam.bottom = min.y; cam.top = max.y;
    cam.near = Math.max(0.5, -max.z - 120);
    cam.far = -min.z + 10;
    cam.updateProjectionMatrix();
    const fd = dirFromAngles(this.params.keyAz + 180, 6, new THREE.Vector3());
    this.lights.fill.target.position.copy(target);
    this.lights.fill.position.copy(target).addScaledVector(fd, 60);
    this.lights.fill.target.updateMatrixWorld();
  },

  resize() {
    const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, this.quality.maxDpr);
    this.renderer.setPixelRatio(dpr);
    this.renderer.setSize(w, h, false);
    const outW = Math.round(w * dpr), outH = Math.round(h * dpr);
    this.post.setSize(outW * this.renderScale, outH * this.renderScale, outW, outH);
    CreekMirror.setSize(this.post.w, this.post.h);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    this.viewW = w;
    this.viewH = h;
  },

  setQuality(key, user = false) {
    if (!QUALITY_TIERS[key]) return;
    this.qualityKey = key;
    this.quality = QUALITY_TIERS[key];
    if (user) storage.set('linjian.quality', key);
    this.renderScale = 1;
    this.scaleCeil = 1;
    this.post.setQuality(this.quality);
    CreekMirror.setQuality(this.quality);
    this.applyQuality();
    this.resize();
    UI.setQuality(key);
  },

  applyQuality() {
    const q = this.quality;
    const key = this.lights.key;
    if (key && key.shadow.mapSize.x !== q.shadowSize) {
      key.shadow.mapSize.set(q.shadowSize, q.shadowSize);
      if (key.shadow.map) {
        key.shadow.map.dispose();
        key.shadow.map = null;
      }
    }
    for (const s of this.systems) if (s.setQuality) s.setQuality(q);
  },

  setTimeTarget(v, animate) {
    const t = this.tod;
    v = clamp(v, 0, 2);
    if (!animate) {
      t.value = t.to = v;
      t.anim = 1;
      t.dirty = true;
    } else {
      t.from = t.value;
      t.to = v;
      t.anim = 0;
      t.dur = 2.2 + Math.abs(v - t.value) * 2.2;
    }
  },

  updateTimeOfDay(dt, force = false) {
    const t = this.tod;
    if (t.anim < 1) {
      t.anim = Math.min(1, t.anim + dt / t.dur);
      t.value = lerp(t.from, t.to, easeInOutSine(t.anim));
      t.dirty = true;
    }
    if (!t.dirty && !force) return;
    t.dirty = false;
    const p = samplePresets(t.value, this.params);
    applyTimeParams(p, this.lights);
    this.fitShadow();
    const s = this.post.state;
    s.temp = p.temp;
    s.tint = p.tint;
    s.contrast = p.contrast * 1.2;
    s.sat = p.sat * 1.12;
    s.split = p.split;
    s.lift = p.lift * 0.6;
    s.shadowTint.copy(p.shadowTint);
    s.highTint.copy(p.highTint);
    s.bloom = p.bloom;
    s.rays = p.rays;
    for (const sys of this.systems) if (sys.setTime) sys.setTime(p);
    Sky.envDirty = true;
    UI.setTimeValue(t.value);
  },

  updateWind(time) {
    const g = 0.5 + 0.35 * Noise.n2(time * 0.07, 3.7) + 0.25 * Noise.n2(time * 0.21, 8.1);
    this.gust = clamp(g, 0, 1);
    const a = (-35 + 12 * Noise.n2(time * 0.01, 1.3)) * DEG;
    U.uWind.value.set(Math.sin(a), Math.cos(a), this.params.wind ?? 0.8, this.gust);
  },

  placeCamera(dt = 0, time = 0) {
    if (this.manualCamera) {
      const m = this.manualCamera;
      this.camera.position.copy(m.pos);
      this.camera.up.set(0, 1, 0);
      this.camera.lookAt(m.look);
      this.setHFov(m.fov);
      this.post.state.focus = m.pos.distanceTo(m.look);
      this.post.state.fstop = m.fstop || 5.6;
      this.post.state.autoFocus = false;
      this.shotExposure = 1;
      return;
    }
    if (this.mode === 'cine') {
      this.director.update(dt);
      this.director.apply(this.camera, time);
    } else {
      this.orbit.update(dt);
      this.orbit.apply(this.camera);
      if (performance.now() - this.lastInput > 30000 && !this.clock.frozen) this.setMode('cine');
    }
  },

  // Horizontal field of view stays constant across aspect ratios; portrait screens crop the sides.
  setHFov(hfov) {
    this.currentHFov = hfov;
    const fit = Math.max(this.camera.aspect, 0.9);
    const fov = (2 * Math.atan(Math.tan((hfov * DEG) / 2) / fit)) / DEG;
    if (Math.abs(fov - this.camera.fov) > 1e-4) {
      this.camera.fov = fov;
      this.camera.updateProjectionMatrix();
    }
  },

  crossfade(dur) {
    this.post.state.cross = 0;
    this.cross = { t: 0, dur };
  },

  setMode(mode, { user = false } = {}) {
    if (mode === this.mode) return;
    if (mode === 'free') {
      this.orbit.fromCamera(this.camera, this.post.state.focus);
      UI.showTitle(false);
      this.director.titleShown = false;
      const touch = matchMedia('(pointer: coarse)').matches;
      UI.hint(touch ? '单指拖动旋转 · 双指缩放和平移 · 闲置片刻后回到电影镜头' : '拖动旋转 · 滚轮缩放 · 右键或 Shift 拖动平移 · 闲置片刻后回到电影镜头', 6000);
    } else {
      this.post.freezeFrame();
      this.crossfade(1.6);
      this.director.start(this.director.index + 1);
    }
    this.mode = mode;
    this.lastInput = performance.now();
    UI.setMode(mode);
    void user;
  },
  toggleSound() {
    this.sound = !this.sound;
    if (typeof Ambience !== 'undefined') Ambience.setEnabled(this.sound, this);
    UI.setSound(this.sound);
    storage.set('linjian.sound', this.sound ? '1' : '0');
  },
  wasDrag() { return this.dragFlag; },

  updateFrameState(dt) {
    const s = this.post.state;
    if (this.cross) {
      this.cross.t += dt;
      s.cross = smoothstep(0, 1, this.cross.t / this.cross.dur);
      if (this.cross.t >= this.cross.dur) { s.cross = 1; this.cross = null; }
    }
    if (this.fadeIn) {
      this.fadeIn.t += dt;
      s.fade = 1 - smoothstep(0, 1, this.fadeIn.t / this.fadeIn.dur);
      if (this.fadeIn.t >= this.fadeIn.dur) { s.fade = 0; this.fadeIn = null; }
    }
    const aspect = this.camera.aspect;
    const target = this.mode === 'cine' && !this.manualCamera && aspect > 1.15 && aspect < 2.39 ? (1 - aspect / 2.39) / 2 : 0;
    s.bars = this.manualBars ?? damp(s.bars, target, 3, dt);
    s.exposure = (this.params.exposure || 1) * this.shotExposure;
    s.grain = this.reducedMotion ? 0.02 : 0.035;
  },

  tick(now) {
    const dt = Math.min(0.1, Math.max(0, (now - this.clock.last) / 1000));
    this.clock.last = now;
    if (this.clock.paused) return;
    this.measure(dt);
    this.frame(dt);
  },

  measure(dt) {
    const p = this.perf;
    p.acc += dt;
    p.frames++;
    if (p.cooldown > 0) p.cooldown -= dt;
    if (p.acc < 1) return;
    const avg = p.acc / p.frames;
    p.acc = 0;
    p.frames = 0;
    if (avg > 0.024) { p.slow++; p.fast = 0; } else if (avg < 0.0185) { p.fast++; p.slow = 0; } else { p.slow = 0; p.fast = 0; }
    if (p.slow >= 2 && this.renderScale > 0.6) {
      this.scaleCeil = this.renderScale;
      this.renderScale = Math.max(0.6, this.renderScale - 0.1);
      p.slow = 0;
      p.cooldown = 6;
      this.resize();
    } else if (p.fast >= 6 && p.cooldown <= 0 && this.renderScale < this.scaleCeil - 0.01) {
      this.renderScale = Math.min(this.scaleCeil - 0.05, this.renderScale + 0.05);
      p.fast = 0;
      p.cooldown = 4;
      this.resize();
    }
  },

  frame(dt) {
    this.renderer.info.reset();
    if (this.clock.frozen === null) this.clock.time += dt;
    const time = this.clock.frozen ?? this.clock.time;
    U.uTime.value = time;
    this.updateWind(time);
    this.updateTimeOfDay(dt);
    this.envTimer += dt;
    if (Sky.envDirty && (this.envTimer > 0.3 || this.tod.anim >= 1)) {
      Sky.updateEnv(this.renderer);
      this.envTimer = 0;
    }
    this.placeCamera(dt, time);
    this.updateFrameState(dt);
    for (const s of this.systems) if (s.update) s.update(dt, time, this);
    Ambience.update(this, dt);
    Sky.dome.position.copy(this.camera.position);
    this.post.updateSun(this.camera, U.uScatterDir.value, this.params.keyEl);
    CreekMirror.update(this);
    this.post.render(this.scene, this.camera, time, dt);
  },

  stats() {
    const info = this.renderer.info;
    return {
      quality: this.qualityKey,
      scale: this.renderScale,
      calls: info.render.calls,
      triangles: info.render.triangles,
      points: info.render.points,
      geometries: info.memory.geometries,
      textures: info.memory.textures,
      programs: info.programs ? info.programs.length : 0,
      size: [this.post.w, this.post.h],
    };
  },
};

window.__cabin = {
  ready: false,
  freeze(t) { App.clock.frozen = t; },
  unfreeze() { App.clock.frozen = null; },
  pause(p = true) { App.clock.paused = p; },
  renderFrames(n = 1) { for (let i = 0; i < n; i++) App.frame(1 / 30); },
  setTime(v) { App.setTimeTarget(v, false); App.updateTimeOfDay(0, true); Sky.updateEnv(App.renderer, true); },
  setQuality(k) { App.setQuality(k); },
  setCamera(pos, look, hfov = 50, fstop = 5.6) {
    App.manualCamera = { pos: new THREE.Vector3(...pos), look: new THREE.Vector3(...look), fov: hfov, fstop };
  },
  clearCamera() { App.manualCamera = null; },
  setShot(i, u = 0.5) {
    document.body.classList.add('no-anim');
    UI.showTitle(SHOTS[i].title && SHOTS[i].dur * u > 2.2 && SHOTS[i].dur * u < 10.5);
    App.director.titleShown = !!(SHOTS[i].title && SHOTS[i].dur * u > 2.2 && SHOTS[i].dur * u < 10.5);
    App.manualCamera = null;
    App.mode = 'cine';
    UI.setMode('cine');
    App.director.start(i, SHOTS[i].dur * u);
    App.post.state.cross = 1;
    App.cross = null;
    App.fadeIn = null;
    App.post.state.fade = 0;
  },
  setMode(m) { App.setMode(m); },
  bars(v) { App.manualBars = v; },
  setPost(o) { Object.assign(App.post.state, o); },
  stats() { return App.stats(); },
  breakdown() {
    const rows = [];
    App.scene.traverse((o) => {
      if (!o.isMesh || !o.visible) return;
      const g = o.geometry;
      const tris = (g.index ? g.index.count : g.attributes.position.count) / 3;
      const n = o.isInstancedMesh ? o.count : g.isInstancedBufferGeometry ? g.instanceCount : 1;
      rows.push([o.name || o.type, Math.round(tris), n, Math.round(tris * n), o.castShadow ? 'S' : '']);
    });
    rows.sort((a, b) => b[3] - a[3]);
    return rows.slice(0, 40).map((r) => r.join(' | ')).join('\n');
  },
  groundY(x, z) { return World.heightAt(x, z); },
  preset(i, o) {
    for (const [k, v] of Object.entries(o)) PRESETS[i][k] = PRESET_COLORS.includes(k) ? lin(v) : v;
    App.updateTimeOfDay(0, true);
    Sky.updateEnv(App.renderer, true);
  },
  obj(name) { return App.scene.getObjectByName(name); },
  show(name, v = true) { const o = App.scene.getObjectByName(name); if (o) o.visible = v; return !!o; },
};

App.init().catch((err) => showFatal('场景初始化时出错：' + (err && err.message ? err.message : String(err)), err));

</script>

</body>
</html>
